}

// ---------- TURN SYSTEM V4: 先手值优先级 ----------
// 机制：默认先手值=8，先手+x = 8+x，后手-x = 8-x。双方选定技能后比较先手值，高者先动。

function playerUseSkill(skillIdx) {
  if (gameState.battleOver) return;
  var player = gameState.playerActive;
  var skill = player.skills[skillIdx];
  if (!skill || skill.pp <= 0) return;
  // 状态判定与回合递减统一在 resolveTurn 内处理，避免同一回合扣两次
  gameState.pendingPlayerSkill = skillIdx; stopTurnTimer();
  // 禁用按钮
  var btns = document.querySelectorAll("#battle-actions button");
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  aiDecideAndResolve();
}

function endTurnCleanup() {
  gameState.isPlayerTurn = true; updateBattleUI(); renderBattleActions();
}

function aiDecideAndResolve() {
  if (gameState.battleOver) return;
  var ai = gameState.aiActive, player = gameState.playerActive;
  
  // 先选招，行动能力统一在本回合结算内判定，选招阶段不抽取麻痹随机数。
  // AI选技能（与旧版相同逻辑）
  var available = ai.skills.filter(function(s) { return s.pp > 0; });
  if (available.length === 0) {
    addMessage(ai.name + " 所有技能PP耗尽！");
    gameState.pendingAISkill = -1; // signal no skill
  } else {
    var bestSkill = available[0], bestScore = -Infinity;
    for (var i = 0; i < available.length; i++) {
      var sk = available[i], score = sk.power || 30;
      var eff = getEffectiveness(sk.element, player.element); score *= eff;
      if (sk.effect && sk.effectChance > 30) score += 20;
      if (sk.onUse) score += 15;
      if (score > bestScore) { bestScore = score; bestSkill = sk; }
    }
    gameState.pendingAISkill = ai.skills.indexOf(bestSkill);
  }
  
  resolveTurn();
}

// 无技能可用时的兜底动作：不占 PP 槽、普通系物理、25% 反伤
function makeStruggleSkill() {
  return { id: "__struggle", name: "挣扎", element: "normal", power: 40, pp: 0, maxPp: 0, accuracy: 100,
    category: "physical", priority: 8, __struggle: true, desc: "无技能可用时的拼死一搏" };
}

function resolveTurn() {
  if (gameState.battleOver) return;
  var player = gameState.playerActive, ai = gameState.aiActive;
  var pSkillIdx = gameState.pendingPlayerSkill;
  var aSkillIdx = gameState.pendingAISkill;
  gameState.turnCount++;
  // 在任何天气、异常或回合效果伤害前复位；场下宠物本回合也可能被换上。
  gameState.playerParty.concat(gameState.aiParty).forEach(function(pet) {
    pet.segmentIdx = 0; pet.lethalHitThisTurn = false; pet.lethalHandled = false;
    pet.immuneBackhand = false; pet.invincible = false;
  });
  [player, ai].forEach(function(pet) { pet.lastDealtDamage = pet.currentDealt || 0; pet.currentDealt = 0; });
  // 无法行动的一方本回合强制空过；状态回合只在这里推进一次
  var playerCanAct = player.canAct(), aiCanAct = ai.canAct();
  if (!playerCanAct) pSkillIdx = -1;
  if (!aiCanAct) aSkillIdx = -1;
  var playerSkipped = !!gameState.skipPlayerAction;  // 本回合玩家已用"换宠"占用行动
  gameState.skipPlayerAction = false;
  var pSkill = pSkillIdx >= 0 ? player.skills[pSkillIdx] : null;
  var aSkill = aSkillIdx >= 0 ? ai.skills[aSkillIdx] : null;
  if (pSkill && pSkill.pp <= 0) pSkill = null;
  if (aSkill && aSkill.pp <= 0) aSkill = null;

  // 玩家无法行动：推进状态（睡眠/冰冻/恐惧/麻痹回合递减），本回合不出招
  if (!pSkill && !playerCanAct) {
    if (player.status === "sleep") {
      player.statusTurns--;
      if (player.statusTurns <= 0) { player.status = null; addMessage(player.name + " 醒过来了！"); }
      else { addMessage(player.name + " 正在睡觉..."); }
    } else if (player.status === "freeze") {
      if (Math.random() < 0.2) { player.status = null; addMessage(player.name + " 解冻了！"); }
      else { addMessage(player.name + " 被冰冻了，无法行动！"); }
    } else if (player.status === "fear") {
      player.statusTurns--;
      if (player.statusTurns <= 0) { player.status = null; addMessage(player.name + " 从恐惧中恢复！"); }
      else { addMessage(player.name + " 被恐惧了，无法行动！"); }
    } else if (player.status === "paralyze") {
      addMessage(player.name + " 因麻痹无法行动！");
    }
  }
  // AI无法行动：推进状态，本回合不出招
  if (!aSkill && !aiCanAct) {
    if (ai.status === "sleep") {
      ai.statusTurns--;
      if (ai.statusTurns <= 0) { ai.status = null; addMessage(ai.name + " 醒过来了！"); }
      else { addMessage(ai.name + " 正在睡觉..."); }
    } else if (ai.status === "freeze") {
      if (Math.random() < 0.2) { ai.status = null; addMessage(ai.name + " 解冻了！"); }
      else { addMessage(ai.name + " 被冰冻了，无法行动！"); }
    } else if (ai.status === "fear") {
      ai.statusTurns--;
      if (ai.statusTurns <= 0) { ai.status = null; addMessage(ai.name + " 从恐惧中恢复！"); }
      else { addMessage(ai.name + " 被恐惧了，无法行动！"); }
    } else if (ai.status === "paralyze") {
      addMessage(ai.name + " 因麻痹无法行动！");
    }
  }
  // 有行动能力却没有可用技能（PP 耗尽）→ 挣扎，避免整局无法推进
  if (!pSkill && !playerSkipped && playerCanAct) pSkill = makeStruggleSkill();
  if (!aSkill && aiCanAct) aSkill = makeStruggleSkill();
  // 双方空过也走完整回合管线，持续效果和计时均正常推进。
  
  var pPrio = pSkill ? ((player.priorityOverride !== null && player.priorityOverride !== undefined) ? player.priorityOverride : (pSkill.priority || 8)) : 0;
  var aPrio = aSkill ? ((ai.priorityOverride !== null && ai.priorityOverride !== undefined) ? ai.priorityOverride : (aSkill.priority || 8)) : 0;
  // 迷雾天气：幽灵系技能先手值+1
  if (gameState.weather === "mist") {
    if (pSkill && pSkill.element === "ghost") pPrio += 1;
    if (aSkill && aSkill.element === "ghost") aPrio += 1;
  }
  // 清念灵体：双方同回合使用同类技能（同为变化或同为威力）时，清灵获得微灵印记
  if (pSkill && aSkill) {
    var pCat = pSkill.category === "status" ? "status" : "power";
    var aCat = aSkill.category === "status" ? "status" : "power";
    if (pCat === aCat) {
      var qlPets = [player, ai].filter(function(pet){ return pet && pet.bloodline && pet.bloodline.name === "清念灵体"; });
      if (qlPets.length > 0) {
        // 维持微灵印记原有的基础先手计数；与沉脉削弱的联动另行裁定。
        var addMark = (pSkill.priority || 8) + (aSkill.priority || 8);
        var emptyPP = [player, ai].reduce(function(s, pt){ return s + pt.skills.filter(function(sk){ return sk.pp === 0; }).length; }, 0);
        var markCap = 100 + emptyPP * 20;
        qlPets.forEach(function(pet){
          pet.bloodlineData = pet.bloodlineData || {};
          pet.bloodlineData.microLing = Math.min(markCap, (pet.bloodlineData.microLing || 0) + addMark);
          addMessage("【清念灵体】双方同用" + (pCat === "status" ? "变化" : "威力") + "技能，" + pet.name + " 获得" + addMark + "点微灵印记（累计" + pet.bloodlineData.microLing + "/" + markCap + "）！");
        });
      }
    }
  }
  // 梦境环境：清翎覆尘出招速度反转为后手-7（先手+7→后手-7）
  if (gameState.field === "dream") {
    if (pSkill && pSkill.id === "sk_qy_1") pPrio = 1;
    if (aSkill && aSkill.id === "sk_qy_1") aPrio = 1;
  }
  if (pSkill) pPrio -= pSkill.qingnianPriorityLoss || 0;
  if (aSkill) aPrio -= aSkill.qingnianPriorityLoss || 0;
  
  processWeather();processField();
  var ti=document.querySelector("#turn-indicator"); if (ti) ti.style.display = "none";
  createBattleContext().savePPState();
  processBloodlines();
  applyEndOfTurnEffects(player); applyEndOfTurnEffects(ai);
  processTurnEffects(player); processTurnEffects(ai);
  
  addMessage("━━━ 第 " + gameState.turnCount + " 回合 ━━━");
  
  // 先手值比较；平手时速度高者先动。梦境环境下整体反转：先手值低者先动，同值速度慢者先动

  // 瞬华环境：光系宠物+15%速度（影响平局先手判定）
  var pSpdEff = player.getStat("spd"), aSpdEff = ai.getStat("spd");
  if (gameState.field === "shunhua") {
    if (player.element === "light") pSpdEff = Math.floor(pSpdEff * 1.15);
    if (ai.element === "light") aSpdEff = Math.floor(aSpdEff * 1.15);
  }
  var dreamActive = gameState.field === "dream";
  var playerFirst;
  if (!pSkill) playerFirst = false;           // 玩家无技能：AI先动
  else if (!aSkill) playerFirst = true;       // AI无技能：玩家先动
  else playerFirst = dreamActive
    ? ((pPrio < aPrio) || (pPrio === aPrio && pSpdEff <= aSpdEff))
    : ((pPrio > aPrio) || (pPrio === aPrio && pSpdEff >= aSpdEff));
  gameState.pendingFirstMove = playerFirst ? "player" : "ai";
  
  if (playerFirst) {
    addMessage(player.name + " 先手！（先手" + fmtPriority(pPrio) + " vs " + fmtPriority(aPrio) + (dreamActive?"，梦境反转！":"") + "）");
    if (pSkill) runSkillTurn(player, ai, pSkill, "player");
    if (!ai.isFainted() && !player.isFainted() && aSkill) runSkillTurn(ai, player, aSkill, "ai");
  } else {
    addMessage(ai.name + " 先手！（先手" + fmtPriority(aPrio) + " vs " + fmtPriority(pPrio) + (dreamActive?"，梦境反转！":"") + "）");
    if (aSkill) runSkillTurn(ai, player, aSkill, "ai");
    if (!player.isFainted() && !ai.isFainted() && pSkill) runSkillTurn(player, ai, pSkill, "player");
  }
  
  // 后处理
  postDamageProcessing();
  updateBattleUI();
  checkFaints();
  if (!gameState.battleOver) tickEnvironments();
  // 极尽降华被动触发（本回合内 PP 被删空）
  if (gameState.pendingJianghua) {
    var pj = gameState.pendingJianghua; gameState.pendingJianghua = null;
    var pjOpp = gameState.playerActive === pj ? gameState.aiActive : gameState.playerActive;
    var pjSk = pj.skills.find(function(s){ return s.id === "sk_jydm_1"; });
    if (pjSk && pjOpp) { applyQingnianSuppression(pj, pjSk); pjSk.onUse(pj, pjOpp, createBattleContext()); addMessage("【极尽降华】PP 被删除，被动发动！"); }
  }
  createBattleContext().saveSnapshot();
  [player, ai].forEach(function(p){ if (p) { p.lastTurnOutput = p.outputThisTurn || 0; p.outputThisTurn = 0; p.lastTakenSegments = (p.damageTakenThisTurn || []).slice(); p.lastTakenTotal = (p.damageTakenThisTurn || []).reduce(function(a,b){ return a + b; }, 0); p.damageTakenThisTurn = []; p.skillsUsedThisTurn = 0; } });
  
  gameState.pendingPlayerSkill = null;
  gameState.pendingAISkill = null;
  
  endTurnCleanup();
}

function fmtPriority(p) {
  if (p > 8) return "+" + (p - 8);
  if (p < 8) return "-" + (8 - p);
  return "±0";
}

// 包一层：确保技能内产生的日志带上“我方/敌方”，异常路径也会复位
function runSkillTurn(user, target, skill, who) {
  gameState.currentActingSide = who;
  try { executeSkillTurn(user, target, skill, who); }
  finally { gameState.currentActingSide = null; }
}

function executeSkillTurn(user, target, skill, who) {
  if (user.isFainted() || target.isFainted()) return;
  // R04/R05：执行前复查——已离场、技能 PP 已被删空、或已陷入控制，取消本次行动
  if (user !== gameState.playerActive && user !== gameState.aiActive) { addMessage(user.name + " 已离场，行动取消！"); return; }
  if (target !== gameState.playerActive && target !== gameState.aiActive) { addMessage(target.name + " 已不在场上，本次行动取消！"); return; }
  if (!skill.__struggle && skill.pp <= 0) { addMessage(user.name + " 的" + skill.name + "已无PP，行动取消！"); return; }
  if (!user.canAct()) { addMessage(user.name + " 无法行动！"); return; }
  var isPlayer = who === "player";
  // 迷雾天气：主动行动结算前 80% 概率令自身混乱
  if (gameState.weather === "mist" && (user.statusImmunities || []).indexOf("confuse") < 0 && !user.statImmunity) {
    if (Math.random() < 0.8) { user.status = "confuse"; user.confuseTurns = 1; addMessage("迷雾缭绕，" + user.name + " 在行动前陷入混乱！"); }
  }
  var lastEff = 1, lastDmgVal = 0;
  var ctx = createBattleContext();
  ctx.sourceSkill = skill; ctx.sourceSkillOwner = user;
  var ppCostOnMiss = Math.max(1, Math.round((user.skillPPCostMult || 1) + (skill.extraPPCost || 0)));
  
  // 轻风散魂：下回合闪避非必中技能（一次性）
  if (target.dodgeNextTurnNonSure && !skill.semiSure && skill.category !== "status") {
    applyQingnianSuppression(user, skill);
    target.dodgeNextTurnNonSure = false;
    addMessage(target.name + " 闪避了" + user.name + " 的非必中技能！");
    return;
  }
  // 命中判定：半必中（semiSure）仅在对方"必定闪避"时 miss，其余必中
  if (skill.semiSure) {
    if (target.sureDodge) {
      applyQingnianSuppression(user, skill);
      var missBefore = skill.pp;
      skill.pp = Math.max(0, skill.pp - ppCostOnMiss);
      addMessage(target.name + " 必定闪避了 " + user.name + " 的 " + skill.name + "！（PP " + missBefore + "→" + skill.pp + "）");
      if (skill.onMiss) skill.onMiss(user, target, ctx);
      return;
    }
  } else if (skill.accuracy < 100 && Math.random() * 100 > skill.accuracy) {
    applyQingnianSuppression(user, skill);
    var missBefore = skill.pp;
    skill.pp = Math.max(0, skill.pp - ppCostOnMiss);
    addMessage(user.name + " 的 " + skill.name + " 没有命中！（PP " + missBefore + "→" + skill.pp + "）");
    return;
  }
  // 化念作刃先手闪避：target 有标志、本技能非必中、user 为后手 → 闪避
  var userIsBackhand = gameState.pendingFirstMove !== (isPlayer ? "player" : "ai");
  if (!skill.semiSure && target.dodgeNextNonSure && skill.accuracy < 100 && userIsBackhand) {
    applyQingnianSuppression(user, skill);
    var dodgeBefore = skill.pp;
    skill.pp = Math.max(0, skill.pp - ppCostOnMiss);
    addMessage(target.name + " 闪避了后手非必中技能！视物攻+2！（PP " + dodgeBefore + "→" + skill.pp + "）");
    target.atkStage = Math.min(6, target.atkStage + 2);
    target.dodgeNextNonSure = false;
    updateBattleUI(); checkFaints(); return;
  }
  // 闪避失败：target 有标志、本技能必中、user 为后手 → 倒置双方强化+删对方2PP
  if (!skill.semiSure && target.dodgeNextNonSure && skill.accuracy >= 100 && userIsBackhand) {
    target.dodgeNextNonSure = false;
    [user, target].forEach(function(p){
      ["atkStage","defStage","spatkStage","spdefStage","spdStage"].forEach(function(k){ if (p[k] !== 0) p[k] = -p[k]; });
    });
    ctx.deletePP(user, -1, 2);
    addMessage("闪避失败！倒置双方强化，删除对方全体2PP！");
  }
  
  // 混乱判定
  if (user.confuseTurns > 0) {
    addMessage(user.name + " 处于混乱状态！");
    if (Math.random() < 0.5) {
      var selfDmg = Math.floor(((2 * user.level / 5 + 2) * 40 * (user.getStat("atk") / user.getStat("def"))) / 50 + 2);
      user.takeDamage(selfDmg);
      addMessage(user.name + " 攻击了自己，受到 " + selfDmg + " 点伤害！");
      user.confuseTurns--; var cfBefore = skill.pp; skill.pp--;
      addMessage(user.name + " 混乱自伤！（PP " + cfBefore + "→" + skill.pp + "）");
      updateBattleUI(); checkFaints(); return;
    }
  }
  
  // PP消耗倍率（化念作刃/极影光幕效果；extraPPCost 为极影光幕连续技惩罚）
  user.skillsUsedThisTurn = (user.skillsUsedThisTurn || 0) + 1;
  skill.useCount = (skill.useCount || 0) + 1;
  var ppCost = Math.max(1, Math.round((user.skillPPCostMult || 1) + (skill.extraPPCost || 0)));
  var ppBeforeUse = skill.pp;
  if (skill.__struggle) {
    addMessage(user.name + " 已无技能可用，只能拼命挣扎！");
  } else {
    skill.pp = Math.max(0, skill.pp - ppCost);
    addMessage(user.name + " 使用了 " + skill.name + "（PP " + ppBeforeUse + "→" + skill.pp + (ppCost > 1 ? " ×" + ppCost : "") + "）！");
  }
  ctx.skillPPCost = skill.__struggle ? 0 : ppBeforeUse - skill.pp;
  applyQingnianSuppression(user, skill);
  // 对方连续技能计数（极影光幕）
  if (user.oppConsecutive) {
    if (user.lastUsedSkillId === skill.id) { user.oppConsecutive[skill.id] = (user.oppConsecutive[skill.id] || 0) + 1; }
    else { user.oppConsecutive = {}; user.oppConsecutive[skill.id] = 1; }
  }
  user.lastUsedSkillId = skill.id;
  if (skill.power > 0) user.lastPowerSkillId = skill.id;
  // 后手伤害免疫（清翎覆尘护盾分支）
  if (target.immuneBackhand && !(gameState.banEffects && gameState.banEffects.reflect) && isPlayer !== (gameState.pendingFirstMove === "player")) {
    if (skill.category !== "status") {
      addMessage(target.name + " 免疫了后手伤害！");
      updateBattleUI(); checkFaints(); return;
    }
  }
  
  // 瞬华环境：先手出招回100精力
  var userIsFirstMove = (gameState.pendingFirstMove === (isPlayer ? "player" : "ai"));
  if (gameState.field === "shunhua" && userIsFirstMove) {
    ctx.doHeal(user, 100);
    ctx.msg("【瞬华环境】先手出招回复100精力！");
  }
  if (skill.onUse) {
    skill.onUse(user, target, ctx);
    if (!user.skillUseCounts) user.skillUseCounts = {};
    user.skillUseCounts[skill.id] = (user.skillUseCounts[skill.id] || 0) + 1;
    // 逆流而行：延迟到下一次威力技能结算（本次只挂起）
    if (user.pendingNilex && skill.power > 0) {
      if (!user.pendingNilex.armed) {
        user.pendingNilex.armed = true;
      } else {
        var pn = user.pendingNilex.cnt;
        user.pendingNilex = null;
        if (pn === 1) {
          ctx.doFixedDamage(target, 9999);
          target.skills.forEach(function(s){ if (!s.immuneToPP) s.pp = 0; });
          user.skills.forEach(function(s){ gainPP(user, s, 1); });
          ctx.msg("【逆流而行】终结：9999固伤，清空对方全体PP，回复自身1PP！");
        } else if (pn === 2) {
          user.skills.forEach(function(s){ gainPP(user, s, 3); });
          ctx.doHeal(user, Math.floor((user.maxHp + (user.maxHpBonus || 0)) * 0.3));
          ctx.msg("【逆流而行】回溯：全体技能+3PP，回复30%精力！");
        }
      }
    }
  } else if (skill.category === "status") {
    applyLegacyStatusSkill(user, target, skill);
  } else {
    var result = calcDamage(user, target, skill);
    lastEff = result.effectiveness; lastDmgVal = result.damage;
    user.lastOutputDmg = result.damage;
    target.takeDamage(result.damage);
    addMessage("造成 " + result.damage + " 点伤害！" + getEffLabel(result.effectiveness) + (result.isCrit ? " 命中要害！" : ""));
    if (skill.__struggle) {
      var recoil = Math.max(1, Math.floor(result.damage * 0.25));
      user.takeDamage(recoil);
      addMessage(user.name + " 因挣扎受到 " + recoil + " 点反伤！");
    }
    if (skill.effect && skill.effectChance > 0 && Math.random() * 100 < skill.effectChance) {
      var eff = getEffectiveness(skill.element, target.element);
      if (eff > 0) applyEffect(target, skill.effect);
    }
  }
  
  // 残脉反弹：target 有 reflectBackhand 且 user 为后手 → 反弹伤害与异常
  if (target.reflectBackhand && !(gameState.banEffects && gameState.banEffects.reflect) && userIsBackhand) {
    var rbDmg = (ctx && ctx._lastDmg !== undefined) ? ctx._lastDmg : lastDmgVal;
    if (rbDmg > 0) {
      user.takeDamage(rbDmg);
      addMessage(target.name + " 反弹了后手伤害" + rbDmg + "点！");
    }
    if (target.status && ["burn","freeze","paralyze","poison","sleep","fear"].indexOf(target.status) >= 0) {
      var rbSt = target.status, rbTurns = target.statusTurns;
      target.status = null; target.statusTurns = 0;
      user.status = rbSt; user.statusTurns = rbTurns;
      addMessage(target.name + " 反弹了异常【" + ({burn:"烧伤",freeze:"冰冻",paralyze:"麻痹",poison:"中毒",sleep:"睡眠",fear:"恐惧"}[rbSt] || rbSt) + "】！");
    }
  }
  // 迷雾天气：主动行动结算后 80% 概率令对手混乱
  if (gameState.weather === "mist" && !target.isFainted() && !target.statImmunity && (target.statusImmunities || []).indexOf("confuse") < 0) {
    if (Math.random() < 0.8) { target.status = "confuse"; target.confuseTurns = 1; addMessage("迷雾缭绕，" + target.name + " 在行动后陷入混乱！"); }
  }
  // 瞬华环境：技能伤害被抵抗则追加原伤害30%固伤
  var resistEff = (ctx && ctx._lastEff !== undefined) ? ctx._lastEff : lastEff;
  var resistDmg = (ctx && ctx._lastDmg !== undefined) ? ctx._lastDmg : lastDmgVal;
  if (gameState.field === "shunhua" && skill.category !== "status" && resistEff < 1 && resistEff > 0 && resistDmg > 0) {
    var reflect = Math.floor(resistDmg * 0.3);
    target.takeDamage(reflect);
    ctx.msg("【瞬华环境】伤害被抵抗，追加" + reflect + "固伤！");
  }
  // 血脉技能后钩子（清念翼系触发/PP回复/切换期）
  if (user.bloodline && user.bloodline.onSkillUse) {
    var ctxAfter = createBattleContext();
    user.bloodline.onSkillUse(user, target, ctxAfter, skill);
  }

  // 受击动画
  var spriteId = isPlayer ? "#ai-sprite" : "#player-sprite";
  var sprite = document.querySelector(spriteId);
  if (sprite) { sprite.classList.add("hit"); setTimeout(function() { sprite.classList.remove("hit"); }, 400); }
  
  updateBattleUI();
  checkFaints();
}

function applyLegacyStatusSkill(user, target, skill) {
  var name = skill.name;
  if (name === "祈雨") { user.spatkStage = Math.min(6, user.spatkStage + 2); addMessage(user.name + " 的特攻大幅提升！"); }
  else if (name === "水流环") { user.heal(Math.floor(user.maxHp / 4)); addMessage(user.name + " 回复了HP！"); }
  else if (name === "光合作用") { user.heal(Math.floor(user.maxHp / 2)); addMessage(user.name + " 回复了大量HP！"); }
  else if (name === "龙之舞") { user.atkStage = Math.min(6, user.atkStage + 1); user.spdStage = Math.min(6, user.spdStage + 1); addMessage(user.name + " 的攻击和速度提升了！"); }
  else if (name === "极光幕") { user.defStage = Math.min(6, user.defStage + 1); user.spdefStage = Math.min(6, user.spdefStage + 1); addMessage(user.name + " 的双防提升了！"); }
  else if (name === "烟雾") { target.accuracyStage = Math.max(-6, target.accuracyStage - 1); addMessage(target.name + " 的命中率降低了！"); }
  else if (name === "冰冻之风") { target.spdStage = Math.max(-6, target.spdStage - 1); addMessage(target.name + " 的速度降低了！");
    var res = calcDamage(user, target, { ...skill, power: 55, category: "special" }); target.takeDamage(res.damage); addMessage("造成 " + res.damage + " 点伤害！"); }
  else if (name === "寄生种子") { if (Math.random() * 100 < 90) applyEffect(target, "leech_seed"); }
  else if (skill.effect && skill.effectChance > 0 && Math.random() * 100 < skill.effectChance) applyEffect(target, skill.effect);
}

// ---------- SWITCH ----------
function applyEndOfTurnEffects(pet) {
  if (!pet || pet.isFainted()) return;
  if (pet.status === "burn" || pet.status === "poison") { var dmg = pet.status === "burn" ? Math.floor(pet.maxHp / 16) : Math.floor(pet.maxHp / 8); pet.takeDamage(dmg); addMessage(pet.name + " 因" + (pet.status === "burn" ? "烧伤" : "中毒") + "受到 " + dmg + " 点伤害！"); }
  if (pet.bindTurns > 0) { pet.bindTurns--; if (pet.bindTurns <= 0) addMessage(pet.name + " 解除了束缚！"); }
  if (pet.leechSeed) { var drain = Math.floor(pet.maxHp / 8); pet.takeDamage(drain); var opp = pet === gameState.playerActive ? gameState.aiActive : gameState.playerActive; if (opp && !opp.isFainted()) opp.heal(drain); addMessage(pet.name + " 被寄生种子吸取了 " + drain + " HP！"); }
}

function playerSwitch(petIdx) {
  var newPet = gameState.playerParty[petIdx];
  if (newPet === gameState.playerActive || newPet.isFainted()) return;

function renderBattleActions() { var container = document.querySelector("#battle-actions"); if (!container) return; container.innerHTML = ""; var player = gameState.playerActive; if (!player || player.isFainted()) return;

  if (["sleep", "freeze", "fear"].indexOf(player.status) >= 0 && !allPPEmpty) {
    var reason = (player.status==="sleep"?"正在睡觉":player.status==="freeze"?"被冰冻":player.status==="fear"?"被恐惧":player.status==="paralyze"?"麻痹无法行动":"无法行动");

    setTimeout(function(){
      if (gameState.battleOver || (gameState.battleId || 0) !== autoBattleId) return;

  player.skills.forEach(function(skill, idx) {

    btn.innerHTML = '<div class="skill-btn-header"><div class="skill-btn-icon" style="background:' + el.bg + '">' + getSkillIcon(skill) + '</div><div class="skill-btn-name">' + escapeHtml(skill.name) + '</div><div class="skill-btn-prio ' + (prio > 8 ? 'fast' : prio < 8 ? 'slow' : 'normal') + '">' + prioStr + '</div></div><div class="skill-btn-body"><span class="skill-power">' + (skill.power ? '威力 ' + Math.round(getSkillPower(skill,skill.power)*100)/100 : '变化技能') + '</span><span class="skill-pp-info"><span class="' + (skill.pp/skill.maxPp < .3 ? 'pp-empty' : '') + '">' + skill.pp + '</span> / ' + skill.maxPp + ' PP</span></div>';
    btn.addEventListener('click', function() { btn.classList.add('pressed'); btn.classList.add('selected'); playerUseSkill(idx); });
    var slot = document.createElement('span'); slot.className = 'skill-slot-label'; slot.textContent = '0' + (idx+1); slot.setAttribute('aria-hidden','true');
    var info = document.createElement('button'); info.className = 'skill-info'; info.textContent = 'i';
    info.setAttribute('aria-label', '查看' + skill.name + '的技能详情');
    info.addEventListener('click', function() { showSkillDetail(skill,info); });
    card.appendChild(btn); card.appendChild(slot); card.appendChild(info); skillList.appendChild(card);
  });
  if (allPPEmpty) {
    var struggle = document.createElement('button'); struggle.className = 'action-btn struggle-btn'; struggle.textContent = '使用挣扎 · 威力40';
    struggle.addEventListener('click', function() { gameState.pendingPlayerSkill = null; stopTurnTimer(); aiDecideAndResolve(); });
    utilities.appendChild(struggle);

  var swBtn = document.createElement('button'); swBtn.className = 'action-btn';
  if (player.bindTurns > 0) { swBtn.textContent = '🔒 束缚中'; swBtn.disabled = true; }
  else if (player.switchLocked) { swBtn.textContent = '🔒 换宠锁定'; swBtn.disabled = true; }
  else { swBtn.textContent = '↔ 更换宠物'; swBtn.addEventListener('click', showSwitchPanel); }
  utilities.appendChild(swBtn);
}

function showSwitchPanel() { var panel = document.querySelector("#switch-panel"), list = document.querySelector("#switch-list"); if (!panel || !list) return; gameState.waitingForSwitch = true; stopTurnTimer(); panel.classList.add("show"); list.innerHTML = ""; gameState.playerParty.forEach(function(pet, idx) { if (pet === gameState.playerActive) return; var btn = document.createElement("button"); btn.className = "switch-pet-btn" + (pet.isFainted() ? " fainted" : ""); btn.disabled = pet.isFainted(); var hpPct = Math.max(0, (pet.hp / pet.maxHp) * 100); var hpCls = hpPct < 25 ? " critical" : hpPct < 50 ? " low" : ""; var stBadges = pet.status ? '<span class="status-badge ' + pet.status + '">' + ({burn:"烧伤",freeze:"冰冻",paralyze:"麻痹",poison:"中毒",sleep:"睡眠",fear:"恐惧"}[pet.status] || pet.status) + '</span>' : ""; btn.innerHTML = '<span class="switch-emoji">' + pet.emoji + '</span><div class="switch-pet-info"><span style="font-weight:700">' + pet.name + ' <span style="font-size: 12px;color:var(--text2)">Lv.' + pet.level + '</span></span><div class="switch-pet-hpwrap"><div class="switch-pet-hpbar"><div class="switch-pet-hpfill' + hpCls + '" style="width:' + hpPct + '%"></div></div><span style="font-size: 12px;color:var(--text2)">' + pet.hp + '/' + pet.maxHp + '</span></div><div class="switch-pet-status">' + stBadges + '</div></div>'; btn.addEventListener("click", function() { playerSwitch(idx); }); list.appendChild(btn); }); }

// ---------- SKILL DETAIL (完整机制展示) ----------
var CATEGORY_NAMES = { physical: "物理", special: "特殊", status: "变化" };
function skillMetaText(skill) {
  var el = ELEMENTS[skill.element] || { name: "?" };
  var acc = skill.semiSure ? "半必中" : (skill.accuracy >= 100 ? "必中" : (skill.accuracy || 100) + "%");
  var parts = [el.name + "系", CATEGORY_NAMES[skill.category] || skill.category, skill.maxPp + "PP", "先手" + fmtPriority(getSkillPriority(skill)), acc];
  if (skill.power) parts.push("威力 " + Math.round(getSkillPower(skill, skill.power) * 100) / 100);
  return parts.join(" · ");
}
function showSkillDetail(skill, trigger) {
  if (!skill) return;
  var old = document.getElementById('skill-detail-overlay');
  if (old) { if (old.closeSkillDetail) old.closeSkillDetail(false); else old.remove(); }
  var returnFocus = trigger || document.activeElement;
  var ov = document.createElement('div'); ov.className = 'modal-overlay show'; ov.id = 'skill-detail-overlay';
  var builtin = DEFAULT_SKILLS.find(function(s) { return s.id === skill.id; });
  var description = skill.detail || skill.desc || '暂无说明';
  if (builtin && skill.detail && skill.desc && skill.desc !== builtin.desc) description = skill.desc + '\n\n' + skill.detail;
  ov.innerHTML = '<div class="modal skill-detail" role="dialog" aria-modal="true" aria-labelledby="skill-detail-title"><h3 id="skill-detail-title">' + escapeHtml(skill.name) + '</h3><div class="skill-detail-meta">' + skillMetaText(skill) + '</div><div class="skill-detail-body" tabindex="0" aria-label="技能机制正文">' + escapeHtml(description) + '</div><div class="form-actions"><button class="btn btn-secondary" id="skill-detail-close">关闭详情</button></div></div>';
  document.body.appendChild(ov);
  var closed = false;
  function close(restore) {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', onKey); ov.remove();
    if (restore !== false && returnFocus && returnFocus.isConnected !== false && returnFocus.focus) returnFocus.focus();
  }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Tab') {
      var items = ov.querySelectorAll('button:not([disabled]), [tabindex="0"]'), first = items[0], last = items[items.length-1];
      if (!first) return;
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  ov.closeSkillDetail = close;
  ov.querySelector('#skill-detail-close').addEventListener('click', function() { close(); });
  ov.addEventListener('click', function(e) { if (e.target === ov) close(); });
  document.addEventListener('keydown', onKey);
  ov.querySelector('#skill-detail-close').focus();
}

var swapTargetPetId = null;

function renderSkillSwap(app) {
  var allPets = getAllPets();
  var html = '<div class="screen active">' + pageHeader('配置出战技能', 'swap-back') + '<p class="page-note">先选择伙伴，再从专属技能池中搭配最多四个出战技能。</p><div class="pet-grid" id="swap-pet-grid">';
  allPets.forEach(function(pet) { html += petChoiceCard(pet, 'data-pet-id'); });

  html += '</div><div id="swap-detail" style="display:none;"></div></div>';
  app.innerHTML = html;
  document.querySelector("#swap-back").addEventListener("click", function() { showScreen("menu"); });
  allPets.forEach(function(pet) {
    var card = document.querySelector('[data-pet-id="' + pet.id + '"]');
    if (card) card.addEventListener("click", function() { openSkillSwap(pet); });
  });
}

// 宠物自有技能：优先 ownedSkillIds，其次内置定义，最后当前技能表
function getOwnedSkillIds(pet) {
  if (typeof pet === "string") pet = getAllPets().find(function(p) { return p.id === pet; }) || {};
  if (Array.isArray(pet.ownedSkillIds) && pet.ownedSkillIds.length) return pet.ownedSkillIds.slice();
  var def = DEFAULT_PETS.find(function(p) { return p.id === pet.id; });
  if (def) return def.skillIds.slice();
  return (pet.skillIds || []).slice();
}

function openSkillSwap(pet, keepDraft) {
  swapTargetPetId = pet.id;
  var detail = document.querySelector("#swap-detail");
  var ownedIds = getOwnedSkillIds(pet);
  if (!keepDraft || !swapDraft || swapDraft.petId !== pet.id) {
    // 旧配置若含非本宠技能，打开时直接剔除
    var sanitized = (pet.skillIds || []).filter(function(id) { return ownedIds.indexOf(id) >= 0; }).slice(0, 4);
    swapDraft = { petId: pet.id, ids: sanitized };
  }
  var equippedIds = swapDraft.ids;
  var allSkills = ownedIds.map(function(id) { return findSkill(id); }).filter(Boolean);
  detail.style.display = "block";
  var html = '<div class="pet-detail-card"><h3>' + pet.emoji + ' ' + pet.name + ' 技能配置</h3><div class="skill-swap-list">';
  allSkills.forEach(function(skill) {
    var isEq = equippedIds.includes(skill.id);
    var eqIdx = isEq ? equippedIds.indexOf(skill.id) : -1;
    html += '<div class="skill-swap-item' + (isEq ? " equipped" : "") + '" data-skill-id="' + skill.id + '"><span class="skill-slot">' + (isEq ? (eqIdx + 1) : "\u2B1C") + '</span>' + (isEq ? '<span class="swap-move-group"><button class="swap-move" data-move="left" data-skill="' + skill.id + '"' + (eqIdx === 0 ? ' disabled' : '') + '>\u25C0</button><button class="swap-move" data-move="right" data-skill="' + skill.id + '"' + (eqIdx === equippedIds.length - 1 ? ' disabled' : '') + '>\u25B6</button></span>' : '') + '<button type="button" class="skill-swap-name swap-toggle" aria-pressed="' + isEq + '" aria-label="' + (isEq ? '卸下' : '装备') + uiAttr(skill.name) + '" style="color:' + (ELEMENTS[skill.element]||{color:"#888"}).color + '">' + escapeHtml(skill.name) + '</button><span class="swap-info">' + (ELEMENTS[skill.element]||{name:'?'}).name + ' · ' + (skill.power || "-") + '威 · ' + skill.maxPp + 'PP</span><button type="button" class="swap-info-btn" aria-label="查看技能详情">i</button></div>';
  });
  html += '</div><div class="swap-help">已装备 <strong>' + equippedIds.length + ' / 4</strong> 个 · 本宠技能池 ' + allSkills.length + ' 个<br>点击切换装备 / 卸下，◀ ▶ 调整顺序。1 号为第一格。</div><button class="btn btn-primary" id="swap-save" style="margin-top:12px;width:100%">保存技能配置</button></div>';
  detail.innerHTML = html;
  // Toggle skill equip
  allSkills.forEach(function(skill) {
    var item = detail.querySelector('[data-skill-id="' + skill.id + '"]');
    var info = item && item.querySelector(".swap-info-btn");
    if (info) info.addEventListener("click", function(ev) { ev.stopPropagation(); showSkillDetail(skill); });
    function toggleSkill() {
      var idx = swapDraft.ids.indexOf(skill.id);
      if (idx < 0 && swapDraft.ids.length >= 4) { alert("最多选择 4 个技能出战！"); return; }
      if (idx >= 0) swapDraft.ids.splice(idx, 1);
      else swapDraft.ids.push(skill.id);
      openSkillSwap(pet, true); // 保留草稿并刷新
      var fresh = detail.querySelector('[data-skill-id="' + uiAttr(skill.id) + '"] .swap-toggle');
      if (fresh) fresh.focus({ preventScroll: true });
    }
    if (item) {
      item.addEventListener('click', toggleSkill);
      var toggle = item.querySelector('.swap-toggle');
      if (toggle) toggle.addEventListener('click', function(ev) { ev.stopPropagation(); toggleSkill(); });
    }
  });
  detail.querySelectorAll('.swap-move').forEach(function(btn) {
    btn.addEventListener('click', function(ev) {
      ev.stopPropagation();
      var sid = btn.getAttribute('data-skill'), dir = btn.getAttribute('data-move') === 'left' ? -1 : 1;
      var i = swapDraft.ids.indexOf(sid), j = i + dir;
      if (i < 0 || j < 0 || j >= swapDraft.ids.length) return;
      swapDraft.ids.splice(i, 1); swapDraft.ids.splice(j, 0, sid);
      openSkillSwap(pet, true);
      var freshItem = detail.querySelector('[data-skill-id="' + uiAttr(sid) + '"]');
      if (freshItem) {
        var arrow = freshItem.querySelector('[data-move="' + btn.getAttribute('data-move') + '"]');
        var nextFocus = arrow && !arrow.disabled ? arrow : freshItem.querySelector('.swap-toggle');
        if (nextFocus) nextFocus.focus({ preventScroll: true });
      }
    });
  });
  detail.querySelector("#swap-save").addEventListener("click", function() {
    var ids = swapDraft.ids.slice(0, 4);
    if (!ids.length) { alert("至少保留 1 个技能！"); return; }
    var base = getAllPets().find(function(p) { return p.id === pet.id; }) || pet;
    var isBuiltin = DEFAULT_PETS.some(function(dp) { return dp.id === pet.id; });
    if (isBuiltin) {
      // R02：内置宠物只保存技能配置，不序列化整只宠物（避免血脉函数丢失）
      var loadouts = loadPetLoadouts();
      loadouts[pet.id] = Object.assign({}, loadouts[pet.id], { skillIds: ids, ownedSkillIds: ownedIds.slice() });
      savePetLoadouts(loadouts);
    } else {
      var customPets = loadCustomPets();
      var ci = customPets.findIndex(function(p) { return p.id === pet.id; });
      var record = ci >= 0 ? customPets[ci] : JSON.parse(JSON.stringify(base));
      record.skillIds = ids;
      record.ownedSkillIds = ownedIds.slice();  // 锁定本宠技能池，后续只能在这批里换
      if (ci >= 0) customPets[ci] = record; else customPets.push(record);
      saveCustomPets(customPets);
    }
    swapDraft = null;
    addMessage(pet.name + " 的技能配置已保存！（" + ids.length + " 个技能）");
    showScreen("skillswap");
  });
}

function saveSkillForm(isEdit, orig) {
  var name = document.querySelector("#fs-name").value.trim();
  if (!name) { alert("请输入名称！"); return; }
  var ns = {
    id: isEdit ? orig.id : ("custom_skill_" + Date.now()),
    name: name,
    desc: document.querySelector("#fs-desc").value.trim()
  };
  var isBuiltin = isEdit && DEFAULT_SKILLS.some(function(s) { return s.id === orig.id; });
  if (!isBuiltin) {
    var pp = parseInt(document.querySelector("#fs-pp").value) || 15;
    Object.assign(ns, {
      element: document.querySelector("#fs-element").value,
      power: parseInt(document.querySelector("#fs-power").value) || 0,
      pp: pp,
      maxPp: pp,
      accuracy: parseInt(document.querySelector("#fs-accuracy").value) || 100,
      category: document.querySelector("#fs-category").value,
      effect: document.querySelector("#fs-effect").value || null,
      effectChance: parseInt(document.querySelector("#fs-effectChance").value) || 0
    });
  }
  var cs = loadCustomSkills();
  var idx = cs.findIndex(function(s) { return s.id === ns.id; });
  if (idx >= 0) cs[idx] = isBuiltin ? Object.assign({}, cs[idx], ns) : ns;
  else cs.push(ns);
  saveCustomSkills(cs);
  closeModal();
  showScreen("pets");
}

function loadFont(lang, fontId) {
  var options = lang === 'cn' ? FONT_OPTIONS_CN : FONT_OPTIONS_EN;
  var opt = options.find(function(f){return f.id===fontId;});
  if (!opt) return;
  var varName = lang === 'cn' ? '--title-font-cn' : '--title-font-en';
  var titleSel = lang === 'cn' ? '.menu-title-cn' : '.menu-title-en';
  if (!document.getElementById('font-' + lang + '-' + fontId)) {
    var link = document.createElement('link');
    link.id = 'font-' + lang + '-' + fontId;
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?' + opt.url + '&display=swap';
    document.head.appendChild(link);
  }
  document.documentElement.style.setProperty(varName, "'" + opt.fam + "', " + (lang==='cn'?"'Microsoft YaHei', serif":"sans-serif"));
  var globalVar = lang === 'cn' ? '--font-game-cn' : '--font-game-en';
  // 英文字体串里不能带 generic 家族：generic 会截断回退链，导致中文字体永远轮不到
  var chain = lang === 'cn' ? ("'" + opt.fam + "', 'Microsoft YaHei', serif") : ("'" + opt.fam + "'");
  document.documentElement.style.setProperty(globalVar, chain);
  if (lang === 'cn') { currentFontCN = fontId; localStorage.setItem('roco_font_cn', fontId); }
  else { currentFontEN = fontId; localStorage.setItem('roco_font_en', fontId); }
  var t = document.querySelector(titleSel);
  if (t) t.style.fontFamily = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  refreshFontMenus();
}

function refreshFontMenus() {
  document.querySelectorAll('.font-option').forEach(function(o){
    var lang = o.getAttribute('data-lang');
    var cur = lang === 'cn' ? currentFontCN : currentFontEN;
    o.classList.toggle('active', o.getAttribute('data-font') === cur);
  });
}
