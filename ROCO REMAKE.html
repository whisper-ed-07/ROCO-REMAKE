<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20170%20110%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220.5%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffe9a8%22%2F%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%23e2b04a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23b8841a%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22b%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220.5%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23d9b45c%22%2F%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%23a8801f%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%236d5210%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M22%2C14%20V86%20M22%2C14%20H54%20A20%2C20%200%200%201%2054%2C54%20H22%20M48%2C54%20L76%2C86%22%20stroke%3D%22url(%23b)%22%20transform%3D%22translate(52%2C20)%20rotate(-13%2038%2042)%22%2F%3E%3Cpath%20d%3D%22M22%2C14%20V86%20M22%2C14%20H54%20A20%2C20%200%200%201%2054%2C54%20H22%20M48%2C54%20L76%2C86%22%20stroke%3D%22url(%23a)%22%20transform%3D%22translate(24%2C0)%20rotate(11%2038%2042)%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>ROCO REMAKE — 洛克王国：对战重置版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&family=Noto+Serif+SC:wght@700;900&display=swap');

:root {
  /* 墨蓝底 + 香槟金 + 珊瑚红：一套克制的"典藏版"配色 */
  --bg: #070910; --surface: #11141f; --surface2: #171b29;
  --text: #ece7dc; --text2: #98a1b6; --accent: #ff7a66;
  --accent2: #ff9d8a; --gold: #e8c37a; --green: #4ec9a0;
  --hp-green: #46cf8b; --hp-yellow: #e8c37a; --hp-red: #ff5d5d;
  --shield-color: #6cb6ff; --border: #262b3a; --radius: 16px;
  --shadow: 0 18px 44px rgba(0,0,0,0.55);
  --glow-gold: 0 0 0 1px rgba(232,195,122,0.35), 0 8px 28px rgba(232,195,122,0.18);
  --glow-accent: 0 0 0 1px rgba(255,122,102,0.4), 0 8px 28px rgba(255,122,102,0.2);
  --line: rgba(232,195,122,0.22);
  --line-soft: rgba(255,255,255,0.07);
  --panel: linear-gradient(165deg, rgba(24,28,42,0.92), rgba(12,15,23,0.94));
  --font-game: 'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;
  --font-game-cn: 'Noto Serif SC','Microsoft YaHei',serif;   /* 全局中文字体 */
  --font-game-en: 'Cinzel',sans-serif;                        /* 全局英文字体 */
}

* { margin:0; padding:0; box-sizing:border-box; }

/* ===== 设置面板 ===== */
.settings-btn {
  position: fixed; bottom: 14px; right: 14px; z-index: 60;
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  background: rgba(26,31,46,0.75); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15); color: var(--text);
  font-size: 20px; transition: all 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.settings-btn:hover { transform: scale(1.1) rotate(45deg); border-color: var(--gold); }
/* 设置二级页面：统一尺寸规格（中英文 UI 一致） */
.settings-scroll { max-height: calc(100vh - 130px); overflow-y: auto; padding: 12px 16px 24px; }
.settings-section { margin-bottom: 12px; }
.settings-section-title { font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 10px; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; padding-left: 4px; }
.font-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.font-option {
  min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 6px 4px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  color: var(--text); cursor: pointer; transition: all 0.15s ease; overflow: hidden;
}
.font-option:hover { background: rgba(226,176,74,0.12); border-color: rgba(226,176,74,0.4); transform: scale(1.04); }
.font-option.active { border-color: var(--gold); color: var(--gold); background: rgba(226,176,74,0.1); box-shadow: 0 0 12px rgba(226,176,74,0.2); }
.font-option .font-demo { display: block; height: 28px; line-height: 28px; max-width: 100%; white-space: nowrap; overflow: hidden; }
.font-option[data-lang="cn"] .font-demo { font-size: 18px; }
.font-option[data-lang="en"] .font-demo { font-size: 14px; }
.font-option .font-name { font-size: 12px; color: var(--text2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.theme-option { font-size: 14px; letter-spacing: 1px; color: var(--text); font-weight: 700; }

/* ===== 流动特效 ===== */
@keyframes flowGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes auroraDrift {
  0% { transform: translateX(-20%) translateY(0) rotate(0deg); opacity: 0.5; }
  50% { transform: translateX(20%) translateY(-30px) rotate(10deg); opacity: 0.9; }
  100% { transform: translateX(-20%) translateY(0) rotate(0deg); opacity: 0.5; }
}
@keyframes particleFloat {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 0.8; }
  100% { transform: translateY(-60vh); opacity: 0; }
}
@keyframes titleShine {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes logoSpin {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(8deg) scale(1.08); }
  50% { transform: rotate(-4deg) scale(1.05); }
  75% { transform: rotate(4deg) scale(1.1); }
  100% { transform: rotate(0deg) scale(1); }
}

/* 主菜单背景流动 */
.menu-screen-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(120deg, #0a0e14, #101a2e, #1a1030, #0d1f17, #0a0e14);
  background-size: 400% 400%;
  animation: flowGradient 15s ease infinite;
}
/* 极光光带 */
.aurora-band {
  position: absolute; height: 60px; border-radius: 50%; filter: blur(40px);
  animation: auroraDrift 12s ease-in-out infinite;
}
.aurora-band.b1 { width: 70%; left: -10%; top: 15%; background: rgba(88,166,255,0.18); }
.aurora-band.b2 { width: 55%; left: 30%; top: 45%; background: rgba(226,176,74,0.12); animation-delay: 4s; }
.aurora-band.b3 { width: 65%; left: 10%; top: 70%; background: rgba(240,114,90,0.14); animation-delay: 8s; }
/* 浮游粒子 */
.particle {
  position: absolute; bottom: -10px; border-radius: 50%;
  background: rgba(226,176,74,0.6);
  animation: particleFloat linear infinite;
}

body {
  font-family: var(--font-game-en), var(--font-game-cn), var(--font-game), sans-serif;
  background: #0a0e14; color: var(--text);
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 25% 40%, rgba(240,114,90,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 30%, rgba(88,166,255,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 85%, rgba(76,175,132,0.04) 0%, transparent 50%);
  background-attachment: fixed;
}

#app { width: 100%; max-width: 520px; min-height: 100vh; position: relative; overflow: hidden; }

.screen {
  display: none; flex-direction: column; min-height: 100vh;
  padding: 20px 16px; animation: screenIn 0.5s cubic-bezier(0.4,0,0.2,1);
}
.screen.active { display: flex; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(18px) scale(0.97); filter: brightness(0.5); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
}
@keyframes screenOut {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.96); }
}
@keyframes fadeInSprite {
  0% { filter: brightness(0%); transform: scale(0.8); }
  60% { filter: brightness(120%); }
  100% { filter: brightness(100%); transform: scale(1); }
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
@keyframes glowPulse { 0%,100% { box-shadow: 0 0 8px rgba(226,176,74,0.2); } 50% { box-shadow: 0 0 24px rgba(226,176,74,0.5); } }
@keyframes hpShine { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes faintOut {
  0% { opacity: 1; filter: brightness(100%); }
  50% { opacity: 0.5; filter: brightness(200%) saturate(0%); }
  100% { opacity: 0; filter: brightness(300%) saturate(0%); transform: scale(0.3); }
}

/* Menu */
.menu-header { text-align: center; padding: 50px 0 30px; }
.menu-card { background: rgba(26,31,46,0.4); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 12px; margin: 0 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
.menu-logo { margin-bottom: 14px; display: inline-block; animation: rGlow 3.4s ease-in-out infinite; }
.menu-logo .roco-mark { width: 150px; height: 97px; display: block; overflow: visible; }
.menu-logo .r-back { animation: rBackSway 3.6s ease-in-out infinite; transform-origin: 90px 62px; }
.menu-logo .r-front { animation: rFrontSway 3.6s ease-in-out infinite; transform-origin: 62px 42px; }
@keyframes rFrontSway {
  0%, 100% { transform: translate(24px, 0) rotate(11deg); }
  50% { transform: translate(24px, -6px) rotate(6deg); }
}
@keyframes rBackSway {
  0%, 100% { transform: translate(52px, 20px) rotate(-13deg); }
  50% { transform: translate(52px, 13px) rotate(-7deg); }
}
@keyframes rGlow {
  0%, 100% { filter: drop-shadow(0 6px 16px rgba(226,176,74,0.32)); }
  50% { filter: drop-shadow(0 10px 28px rgba(226,176,74,0.62)); }
}
.menu-title-cn {
  font-family: var(--title-font-cn, 'Noto Serif SC', 'Microsoft YaHei', serif);
  font-weight: 900; font-size: 26px; letter-spacing: 3px; margin-bottom: 6px;
  background: linear-gradient(120deg, #f0c060, #fff7e0 40%, #e2b04a 60%, #f0c060);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: titleShine 4s linear infinite;
  text-shadow: 0 0 30px rgba(226,176,74,0.3);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.menu-title-en {
  font-family: var(--title-font-en, 'Cinzel'), serif; font-weight: 900;
  font-size: 17px; letter-spacing: 6px; margin-top: 4px;
  background: linear-gradient(180deg, #e8e8f0, #9aa8c0 60%, #6a7a96);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-transform: uppercase;
}
.menu-title {
  font-family: 'Press Start 2P', var(--font-game);
  font-size: 20px; font-weight: 400;
  background: linear-gradient(180deg, var(--gold) 0%, #f0c060 40%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 8px; letter-spacing: 2px; text-shadow: none;
}
.menu-buttons { display: flex; flex-direction: column; gap: 14px; padding: 20px 10px; flex: 1; justify-content: center; }

.btn {
  padding: 16px 28px; border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.2s ease; letter-spacing: 1px;
  position: relative; overflow: hidden;
}
/* ===== 触摸友好：通用按钮最小高度 ===== */
button { min-height: 36px; }

/* ===== 全局字体继承：表单控件默认不继承 body 字体，必须显式声明 ===== */
button, input, select, textarea, .btn { font-family: inherit; }

/* ===== 键盘焦点可见（可访问性） ===== */
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px;
}

.btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn-primary { background: linear-gradient(135deg, #f85149, #da3633); color: #fff; box-shadow: 0 4px 16px rgba(248,81,73,0.3); }
.btn-primary:hover { box-shadow: 0 6px 28px rgba(248,81,73,0.5); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 2px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); background: var(--surface); }
.btn-small { padding: 9px 18px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Screen header */
.screen-header { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.screen-header .back-btn {
  background: none; border: 2px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.screen-header .back-btn:hover { background: var(--surface2); border-color: var(--gold); }
.screen-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

/* Team select */
.pet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; overflow-y: auto; padding-bottom: 16px; align-content: safe center; }
.pet-card {
  background: rgba(26,31,46,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius); padding: 18px 12px; min-height: 132px; cursor: pointer;
  transition: all 0.25s ease; text-align: center; position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.pet-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow); }
.pet-card.selected {
  border-color: var(--gold);
  box-shadow: var(--glow-gold);
  animation: glowPulse 2s infinite;
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.pet-card-emoji { font-size: 44px; margin-bottom: 6px; display: block; }
.pet-card-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.pet-card-element { font-size: 12px; opacity: 0.8; }
.pet-card-check { position: absolute; top: 8px; right: 10px; color: var(--gold); font-size: 22px; display: none; }
.pet-card.selected .pet-card-check { display: block; }
.team-ready-bar { padding: 20px 0; text-align: center; }
.selected-count { font-size: 14px; color: var(--text2); margin-bottom: 12px; }

/* Battle */
.battle-bg {
  background: linear-gradient(180deg, #0d1f17 0%, #121a24 35%, #0a0e14 100%);
  min-height: 100vh; display: flex; flex-direction: column; position: relative;
}
.battle-ground { width: 70%; height: 3px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); border-radius: 2px; margin: 10px 0; }

.pet-sprite {
  width: 100px; height: 100px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; position: relative; transition: all 0.3s ease;
  animation: fadeInSprite 0.8s ease-out;
}
.pet-sprite.opponent { background: radial-gradient(circle, rgba(248,81,73,0.1) 0%, transparent 70%); }
.pet-sprite.player { background: radial-gradient(circle, rgba(88,166,255,0.1) 0%, transparent 70%); }
.pet-sprite.hit { animation: shake 0.5s ease; }
.pet-sprite::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:96px; height:14px; border-radius:50%; background:radial-gradient(ellipse, rgba(226,176,74,0.30) 0%, transparent 72%); filter:blur(3px); pointer-events:none; }
.pet-sprite.fainted { animation: faintOut 1.2s ease forwards; }

.stage-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }
.pet-info-card {
  background: rgba(26,31,46,0.55);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-radius: var(--radius); padding: 16px 20px; margin: 8px 16px;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  min-width: 220px; position: relative;
}
.pet-info-card::before {
  content:""; position:absolute; top:0; left:12px; right:12px; height:1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  pointer-events:none;
}
.pet-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
.pet-info-name { font-weight: 800; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.pet-info-lv { font-size: 12px; color: var(--text2); background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.pet-info-element { font-size: 12px; padding: 3px 10px; border-radius: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }

.hp-bar-outer { width: 100%; height: 14px; background: #1a1f2a; border-radius: 7px; overflow: hidden; position: relative; margin-top: 4px; border: 2px solid #3a3440; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
.hp-bar-inner { height: 100%; border-radius: 5px; transition: width 0.6s ease; position: relative; z-index: 1; }
.hp-bar-ghost { position: absolute; top:0; bottom:0; left:0; background: rgba(255,255,255,0.25); border-radius: 5px; transition: width 1.2s ease 0.3s; z-index: 0; }
.hp-bar-inner::after { content:''; position:absolute; top:0;left:0;right:0;height:40%; background:rgba(255,255,255,0.2); border-radius:5px 5px 0 0; }
.hp-bar-inner { background: var(--hp-green); }
.hp-bar-inner.low { background: var(--hp-yellow); }
.hp-bar-inner.critical { background: var(--hp-red); }

.shield-value { font-size: 12px; color: var(--shield-color); text-align: right; margin-top: 2px; font-weight: 700; letter-spacing: 0.5px; }
.shield-bar-outer { width: 100%; height: 8px; background: #1a1f2a; border-radius: 4px; overflow: hidden; margin-top: 3px; border: 1px solid #3a3440; }
.shield-bar-inner { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #58a6ff, #79c0ff); transition: width 0.4s ease; box-shadow: 0 0 8px rgba(88,166,255,0.3); }

.hp-text { font-size: 12px; color: var(--text2); text-align: right; margin-top: 3px; font-weight: 600; letter-spacing: 0.5px; }
.marks-display { font-size: 12px; color: var(--gold); margin-top: 2px; }

.status-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 8px; margin-left: 6px; font-weight: 700; letter-spacing: 0.5px; }
.status-badge.burn { background: linear-gradient(135deg,#f08030,#e05a1a); color:#fff; }
.status-badge.freeze { background: linear-gradient(135deg,#98d8d8,#68b8b8); color:#1a1a2e; }
.status-badge.paralyze { background: linear-gradient(135deg,#f8d030,#e0b010); color:#1a1a2e; }
.status-badge.poison { background: linear-gradient(135deg,#a040a0,#802080); color:#fff; }
.status-badge.sleep { background: linear-gradient(135deg,#7060a0,#504080); color:#fff; }
.status-badge.confuse { background: linear-gradient(135deg,#e0c068,#c0a040); color:#1a1a2e; }
.status-badge.fear { background: linear-gradient(135deg,#8b0000,#5a0000); color:#fff; }
.status-badge.bind { background: linear-gradient(135deg,#666,#444); color:#fff; }
.status-badge.immune { background: linear-gradient(135deg,#3fb950,#2a8f43); color:#fff; }
.bloodline-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(226,176,74,0.15); color: var(--gold); margin-left: 6px; font-weight: 600; border: 1px solid rgba(226,176,74,0.3); }

.battle-messages {
  margin: 4px 16px; background: rgba(10,14,20,0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius); padding: 10px 14px 10px 16px;
  max-height: 260px; min-height: 160px; overflow-y: scroll;
  overscroll-behavior: contain;            /* 日志内滚动不带动整页 */
  scrollbar-gutter: stable;                /* 滚动条出现时不挤压文字 */
  scrollbar-width: thin;
  scrollbar-color: rgba(232,195,122,0.45) rgba(255,255,255,0.06);
  font-size: 12px; color: var(--text2); line-height: 1.7;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
/* 战斗日志独立滚动条（比全局更明显） */
.battle-messages::-webkit-scrollbar { width: 9px; }
.battle-messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 9px; }
.battle-messages::-webkit-scrollbar-thumb {
  background: rgba(232,195,122,0.42); border-radius: 9px;
  border: 2px solid transparent; background-clip: content-box;
}
.battle-messages::-webkit-scrollbar-thumb:hover { background: rgba(232,195,122,0.75); background-clip: content-box; }
.battle-messages .msg:last-child { color: var(--text); font-weight: 600; background: rgba(226,176,74,0.06); border-radius: 4px; padding: 2px 6px; }
.battle-messages .msg { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.battle-messages .msg:last-child { border-bottom: none; }

.battle-actions { padding: 10px 12px; display: flex; gap: 8px; align-items: stretch; overflow-x: auto; overflow-y: hidden; }
.battle-actions .skill-btn { flex: 1 1 0; min-width: 70px; }
.battle-actions .action-btn { flex: 0 0 84px; white-space: nowrap; }
.battle-actions .skill-btn-name { font-size: 12px; }
.skill-btn {
  padding: 0; border-radius: 12px; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all 0.2s ease;
  text-align: left; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  border: 2px solid transparent;
  background: linear-gradient(rgba(26,31,46,0.85), rgba(26,31,46,0.85)) padding-box,
              linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.08)) border-box;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.skill-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 24px rgba(0,0,0,0.4); border-color: rgba(240,114,90,0.6); }
.skill-btn.no-pp { opacity: 0.25; pointer-events: none; }

.skill-btn-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; }
.skill-btn-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); overflow: hidden; }
/* ===== 官方属系图标 ===== */
.elem-ico { width: 100%; height: 100%; object-fit: contain; display: block; }
.elem-ico-sm { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; display: inline-block; }
.elem-ico-md { width: 22px; height: 22px; object-fit: contain; vertical-align: -5px; display: inline-block; }
.skill-btn-name { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skill-btn-prio { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.skill-btn-prio.fast { background: rgba(63,185,80,0.2); color: #3fb950; }
.skill-btn-prio.slow { background: rgba(248,81,73,0.2); color: #f85149; }
.skill-btn-prio.normal { background: rgba(139,148,158,0.15); color: #8b949e; }

.skill-btn-body { display: flex; align-items: center; gap: 6px; padding: 4px 10px 8px; font-size: 12px; color: var(--text2); }
.skill-btn-body .skill-power { font-weight: 600; color: #e6ed3f; }
.skill-btn-body .skill-pp-info { margin-left: auto; }
.skill-btn-body .skill-ext { color: var(--gold); margin-left: 4px; }
.skill-btn-body .pp-empty { color: var(--hp-red); font-weight: 700; }

.action-btn { padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s ease; text-align: center; }
.action-btn:hover { border-color: var(--gold); background: rgba(226,176,74,0.1); transform: scale(1.02); }

.switch-panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(10,14,20,0.85); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-top: 1px solid rgba(255,255,255,0.1); padding: 20px; display: none; flex-direction: column; gap: 10px; z-index: 10; animation: screenIn 0.25s ease; max-height: 60vh; overflow-y: auto; }
.switch-panel.show { display: flex; }
.switch-pet-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
.switch-pet-btn:hover { border-color: var(--accent); background: var(--surface2); transform: scale(1.02); }
.switch-pet-btn.fainted { opacity: 0.35; }
.switch-pet-btn .switch-emoji { font-size: 26px; }

/* Management */
.mgmt-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.mgmt-tab { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 10px; background: transparent; color: var(--text2); cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; transition: all 0.2s ease; }
.mgmt-tab.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }
.mgmt-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; justify-content: safe center; }
.mgmt-item {
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border: 2px solid var(--border); border-radius: var(--radius);
  padding: 14px; display: flex; align-items: center; gap: 14px;
  transition: all 0.2s ease;
}
.mgmt-item:hover { border-color: var(--accent); transform: translateX(4px); box-shadow: var(--shadow); }
.mgmt-item-emoji { font-size: 34px; min-width: 44px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.mgmt-item-info { flex: 1; }
.mgmt-item-name { font-weight: 700; font-size: 15px; }
.mgmt-item-detail { font-size: 12px; color: var(--text2); margin-top: 3px; }
.mgmt-item-actions { display: flex; gap: 8px; }
.mgmt-item-actions button { padding: 6px 12px; min-height: 40px; min-width: 64px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-size: 12px; transition: all 0.2s ease; }
.mgmt-item-actions button:hover { border-color: var(--accent); transform: scale(1.05); }
.add-btn { padding: 16px; border: 2px dashed var(--border); border-radius: var(--radius); background: transparent; color: var(--text2); cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s ease; text-align: center; }
.add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: rgba(20,24,36,0.9); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.12); animation: screenIn 0.3s ease; box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); }
.modal h3 { font-size: 20px; margin-bottom: 20px; text-align: center; color: var(--gold); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; transition: all 0.2s ease; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,114,90,0.15); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group select { cursor: pointer; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat-grid .form-group { margin-bottom: 8px; }
.stat-grid input { text-align: center; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.form-actions button { flex: 1; }

/* Result */
.result-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 24px; backdrop-filter: blur(8px); }
.result-overlay.show { display: flex; }
.result-emoji { font-size: 96px; animation: pulse 1s ease-in-out infinite; }
.result-text { font-size: 36px; font-weight: 900; text-align: center; letter-spacing: 2px; }
.result-text.win { color: var(--gold); text-shadow: 0 0 40px rgba(226,176,74,0.5); }
.result-text.lose { color: var(--accent); text-shadow: 0 0 40px rgba(248,81,73,0.5); }

/* Skill swap */
.skill-swap-list { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
.skill-swap-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; transition: all 0.2s ease; }
.skill-swap-item:hover { border-color: var(--gold); transform: scale(1.02); }
.skill-swap-item.equipped { border-color: var(--green); background: rgba(63,185,80,0.08); }
.skill-swap-item .skill-slot { font-size: 13px; color: var(--text2); min-width: 22px; }
.swap-move { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text2); font-size: 12px; padding: 2px 6px; cursor: pointer; line-height: 1.2; }
.swap-move:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.swap-move:disabled { opacity: 0.35; cursor: default; }
.skill-swap-item .swap-info { margin-left: auto; font-size: 12px; color: var(--text2); }
.swap-move { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text2); font-size: 12px; padding: 2px 6px; cursor: pointer; line-height: 1.2; }
.swap-move:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.swap-move:disabled { opacity: 0.35; cursor: default; }
.skill-swap-item .swap-info { margin-left: auto; font-size: 12px; color: var(--text2); }
.pet-detail-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 8px 0; }
.pet-detail-card h3 { margin-bottom: 14px; text-align: center; font-size: 18px; }

.turn-indicator { text-align:center;padding:8px;margin:4px 16px;background:linear-gradient(180deg,rgba(226,176,74,0.12),rgba(226,176,74,0.04));border:1px solid rgba(226,176,74,0.3);border-radius:8px;font-weight:900;font-size:14px;color:var(--gold);letter-spacing:2px; }
.turn-timer { display:flex;align-items:center;gap:8px;margin:4px 16px;padding:6px 12px;background:rgba(10,14,20,0.5);backdrop-filter:blur(8px);border-radius:8px;font-size: 12px;color:var(--text2);border:1px solid rgba(255,255,255,0.06); }
.turn-timer #turn-timer-text { font-weight:800; min-width:34px; text-align:center; font-size:12px; color:var(--gold); }
.turn-timer-bar { flex:1;height:4px;background:#1a1f2a;border-radius:2px;overflow:hidden; }
.turn-timer-fill { height:100%;border-radius:2px;background:var(--green);transition:width 1s linear; }
.turn-timer-fill.warning { background:var(--hp-yellow); }
.turn-timer-fill.danger { background:var(--hp-red);animation:pulse 0.5s infinite; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* ===== 电脑端宽屏：左右对战布局 ===== */
/* ===== 横屏战斗布局 ===== */
.battle-top { display:flex; align-items:center; gap:10px; padding:8px 16px 4px; flex-wrap:wrap; position:relative; }
.flee-btn {
  margin-left:auto; padding:8px 18px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:700;
  background:rgba(248,81,73,0.15); border:1px solid rgba(248,81,73,0.45); color:#f85149;
  transition:all 0.2s ease;
}
.flee-btn:hover { background:rgba(248,81,73,0.3); transform:scale(1.05); }
.battle-weather {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  display:flex; gap:8px; align-items:center;
  padding:4px 14px; border-radius:14px;
  background:rgba(10,14,20,0.7); border:1px solid rgba(255,255,255,0.12);
  white-space:nowrap; z-index:5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.w-item { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:10px; }
.w-item.has-weather { color:#ffcc02; background:rgba(255,204,2,0.14); border:1px solid rgba(255,204,2,0.35); box-shadow:0 0 12px rgba(255,204,2,0.25); }
.w-item.has-field { color:#b388ff; background:rgba(179,136,255,0.14); border:1px solid rgba(179,136,255,0.35); box-shadow:0 0 12px rgba(179,136,255,0.25); }
.w-icon { font-size:22px; line-height:1; }
.w-turns { font-size: 12px; opacity:0.85; }
.battle-weather { max-width:70%; overflow-x:auto; }
.battle-row { display:flex; flex-direction:column; flex:1; }
.battle-side { display:flex; flex-direction:column; align-items:center; gap:8px; }
.battle-side .pet-sprite { width:110px; height:110px; font-size:54px; }
.battle-stage { display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
.stage-vs { font-size:24px; font-weight:900; color:var(--text2); opacity:0.5; letter-spacing:3px; }
.battle-bottom { display:flex; flex-direction:column; }
.enemy-side { order:1; }
.player-side { order:2; }
.stages-bar { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; justify-content:center; }
.stage-pill { font-size: 12px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,0.06); color:var(--text2); font-weight:700; }
.stage-pill.up { background:rgba(63,185,80,0.18); color:#3fb950; }
.stage-pill.down { background:rgba(248,81,73,0.18); color:#f85149; }

/* 横屏（≥1024px）：左右分置 */
@media (min-width: 1024px) {
  #app { max-width: 1400px; }
  .battle-row { flex-direction:row; align-items:stretch; padding:12px 24px; }
  .battle-side { flex:1; justify-content:flex-start; }
  .player-side { order:1; }
  .battle-stage { order:2; display:flex; width:170px; }
  .enemy-side { order:3; }
  .battle-side .pet-sprite { width:160px; height:160px; font-size:78px; }
  .pet-info-card { min-width:280px; width:85%; }
  .battle-bottom { flex-direction:row; padding:0 24px 16px; gap:16px; align-items:stretch; height: clamp(240px, 34vh, 360px); }
  .battle-log { flex:0 0 30%; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .battle-panel { flex:1; }
  .battle-log .battle-messages { margin:0; flex:1 1 auto; min-height:0; max-height:none; }
  .battle-panel .battle-actions { padding:0; }
  .turn-indicator, .turn-timer { margin:0; }
  .battle-messages { margin:0; }
  .battle-ground { display:none; }
}

@media (min-width: 768px) {
  #app { max-width: 960px; }
  .pet-grid { grid-template-columns: repeat(3, 1fr); }
  .pet-grid:has(> :nth-child(4)) { grid-template-columns: repeat(4, 1fr); }
  .menu-buttons { max-width: 420px; margin: 0 auto; }
  .skill-btn { min-height: 62px; }
}

/* ===== 伤害飘字 ===== */
.float-text { position:absolute; top:-8px; left:50%; font-size:22px; font-weight:900; pointer-events:none; z-index:60; text-shadow:0 2px 6px rgba(0,0,0,0.6); animation:floatUp 1s ease-out forwards; white-space:nowrap; }
@keyframes floatUp { 0%{opacity:0; transform:translate(-50%,12px) scale(0.7);} 15%{opacity:1; transform:translate(-50%,0) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-46px) scale(1);} }
/* ===== 技能释放反馈 ===== */
.skill-btn.pressed { animation:btnPulse 0.3s ease; }
.skill-btn.selected { border-color:var(--gold) !important; box-shadow:0 0 14px rgba(226,176,74,0.55) !important; }
@keyframes btnPulse { 0%{transform:scale(1);} 50%{transform:scale(0.93);} 100%{transform:scale(1);} }
/* ===== 换宠面板卡片化 ===== */
.switch-pet-btn { flex-direction:row; align-items:center; }
.switch-pet-info { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
.switch-pet-hpwrap { display:flex; align-items:center; gap:6px; }
.switch-pet-hpbar { flex:1; height:6px; background:#1a1f2a; border-radius:3px; overflow:hidden; }
.switch-pet-hpfill { height:100%; background:var(--hp-green); border-radius:3px; transition:width 0.4s ease; }
.switch-pet-hpfill.low { background:var(--hp-yellow); }
.switch-pet-hpfill.critical { background:var(--hp-red); }
.switch-pet-status { display:flex; gap:3px; flex-wrap:wrap; }
/* ===== 亮色主题 ===== */
[data-theme="light"] {
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#eceff4;
  --text:#2d3436; --text2:#636e72; --accent:#e17055;
  --accent2:#ff8a70; --gold:#b8860b; --green:#27ae60;
  --hp-green:#27ae60; --hp-yellow:#f39c12; --hp-red:#e74c3c;
  --shield-color:#2980b9; --border:#dfe4ea;
  --shadow:0 6px 24px rgba(0,0,0,0.12);
  --glow-gold:0 0 16px rgba(184,134,11,0.3);
  --glow-accent:0 0 16px rgba(225,112,85,0.3);
}
[data-theme="light"] body { background-image:radial-gradient(ellipse at 25% 40%, rgba(225,112,85,0.1) 0%, transparent 55%), radial-gradient(ellipse at 75% 30%, rgba(41,128,185,0.1) 0%, transparent 55%); }
[data-theme="light"] .battle-bg { background:linear-gradient(180deg,#e8f0ee 0%,#eef1f6 35%,#f5f6fa 100%); }
[data-theme="light"] .pet-info-card { background:rgba(255,255,255,0.7); }
[data-theme="light"] .battle-messages { background:rgba(255,255,255,0.7); color:var(--text2); }
[data-theme="light"] .battle-messages .msg:last-child { color:var(--text); }
[data-theme="light"] .menu-screen-bg { background:linear-gradient(120deg,#ff6b6b,#ffa94d,#ffd93d,#51cf66,#4dabf7,#9775fa,#ff6b6b); background-size:600% 600%; animation-duration:12s; }
[data-theme="light"] .menu-screen-bg::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.22); pointer-events:none; }
[data-theme="light"] .switch-panel { background:rgba(255,255,255,0.9); }
[data-theme="light"] .modal { background:rgba(255,255,255,0.95); }
[data-theme="light"] .hp-bar-outer { background:#e0e4ea; border-color:#dfe4ea; }
[data-theme="light"] .turn-timer { background:rgba(255,255,255,0.7); }

/* ============================================================
   视觉升级 2026-10：墨底 + 香槟金，统一层级、边框与动效节奏
   ============================================================ */
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1100px 560px at 50% -12%, rgba(232,195,122,0.075), transparent 62%),
    radial-gradient(780px 520px at 10% 28%, rgba(255,122,102,0.05), transparent 62%),
    radial-gradient(900px 620px at 92% 72%, rgba(108,182,255,0.05), transparent 62%);
  letter-spacing: 0.01em;
}
#app { max-width: 560px; }
.screen { padding: 22px clamp(14px, 4vw, 28px) 26px; }

/* ---------- 面板质感 ---------- */
.pet-card, .pet-info-card, .battle-messages, .modal, .pet-detail-card, .mgmt-item {
  background: var(--panel);
  border-color: var(--line-soft);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
}

/* ---------- 按钮 ---------- */
.btn {
  border-radius: 14px; font-weight: 800; letter-spacing: 0.05em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.btn::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 36%, rgba(255,255,255,0.26) 50%, transparent 64%);
  transform: translateX(-130%); transition: transform 0.6s ease;
}
.btn:hover::before { transform: translateX(130%); }
.btn-primary {
  background: linear-gradient(160deg, #f6dfa6, #e3b768 46%, #c8912f);
  color: #241a07;
  box-shadow: 0 10px 26px rgba(232,195,122,0.22), inset 0 1px 0 rgba(255,255,255,0.55);
}
.btn-primary:hover { box-shadow: 0 14px 34px rgba(232,195,122,0.34), inset 0 1px 0 rgba(255,255,255,0.7); }
.btn-secondary {
  background: rgba(255,255,255,0.045); border: 1px solid var(--line-soft); color: var(--text);
}
.btn-secondary:hover { border-color: var(--line); background: rgba(232,195,122,0.08); }
.btn-danger { background: linear-gradient(160deg, #ff8f7d, #d94a3c); color: #fff; }

/* ---------- 主菜单 ---------- */
.menu-header { padding: clamp(34px, 9vh, 74px) 0 4px; }
.menu-header::after {
  content: ''; display: block; width: 128px; height: 1px; margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.menu-logo .roco-mark { width: 164px; height: 106px; }
.menu-title-cn { font-size: clamp(23px, 6.2vw, 30px); letter-spacing: 0.18em; }
.menu-title-en { font-size: 11px; letter-spacing: 0.52em; opacity: 0.9; margin-top: 8px; }
.menu-buttons { gap: 12px; padding: 10px 6px 42px; }
.menu-card { background: rgba(12,15,23,0.55); border: 1px solid var(--line-soft); }

/* ---------- 通用页头 ---------- */
.screen-header { border-bottom: 1px solid var(--line-soft); padding-bottom: 14px; margin-bottom: 18px; }
.screen-title { font-size: 17px; letter-spacing: 0.08em; font-weight: 800; }
.screen-header .back-btn { border-width: 1px; border-color: var(--line-soft); width: 36px; height: 36px; }

/* ---------- 选宠卡片 ---------- */
.pet-card { border-radius: 18px; border-width: 1px; }
.pet-card:hover { border-color: rgba(232,195,122,0.45); transform: translateY(-3px); }
.pet-card.selected {
  outline: none; border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 12px 30px rgba(232,195,122,0.16);
  animation: none;
}
.pet-card-emoji { font-size: 42px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45)); }

/* ---------- 战斗顶栏 ---------- */
.battle-top { padding: 10px clamp(10px, 3vw, 20px) 2px; gap: 8px; }
.turn-indicator {
  margin: 6px auto; padding: 5px 18px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(232,195,122,0.14), rgba(232,195,122,0.03));
  border: 1px solid var(--line); color: #f4dcab;
  font-size: 12px; letter-spacing: 0.22em;
  box-shadow: 0 0 22px rgba(232,195,122,0.12);
}
.turn-timer {
  margin: 4px auto; padding: 4px 14px; border-radius: 999px;
  border: 1px solid var(--line-soft); background: rgba(8,10,16,0.55);
}
.turn-timer-bar { background: rgba(255,255,255,0.08); height: 3px; }
.turn-timer-fill { background: linear-gradient(90deg, #6fe0b0, #2fa96a); }
.flee-btn { border-radius: 999px; font-weight: 700; letter-spacing: 0.04em; }

/* ---------- 宠物信息卡 ---------- */
.pet-info-card { border: 1px solid var(--line-soft); border-radius: 18px; padding: 14px 16px; margin: 10px 14px; overflow: hidden; }
.pet-info-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(140px 70px at 100% 0%, rgba(255,255,255,0.06), transparent 70%);
}
.pet-info-name { font-size: 17px; letter-spacing: 0.02em; }
.pet-info-lv { font-family: var(--font-game-en); letter-spacing: 0.08em; border: 1px solid var(--line-soft); background: rgba(0,0,0,0.35); }
.pet-info-element { border: 1px solid rgba(255,255,255,0.14); }

/* ---------- 血条 / 护盾 / 状态 ---------- */
.hp-bar-outer {
  height: 12px; border: 1px solid rgba(0,0,0,0.6); background: #0a0c12;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7); border-radius: 999px;
}
.hp-bar-outer::after {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 999px;
  background-image: repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,0.38) 11px 12px);
  opacity: 0.55;
}
.hp-bar-inner { border-radius: 999px; background: linear-gradient(180deg, #63e6a1, #2fa96a); box-shadow: 0 0 12px rgba(70,207,139,0.35); }
.hp-bar-inner.low { background: linear-gradient(180deg, #ffd98a, #e0ae4a); }
.hp-bar-inner.critical { background: linear-gradient(180deg, #ff8a8a, #e03b3b); }
.hp-text { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text2); }
.shield-bar-outer { height: 7px; border: 1px solid rgba(108,182,255,0.28); background: #0a0c12; }
.shield-bar-inner { background: linear-gradient(90deg, #4f9dff, #8fd0ff); }
.shield-value { font-variant-numeric: tabular-nums; }
.status-badge {
  border-radius: 999px; padding: 2px 9px; font-size: 11px; letter-spacing: 0.02em;
  border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.stage-pill { border-radius: 7px; font-variant-numeric: tabular-nums; font-size: 11px; border: 1px solid transparent; }
.stage-pill.up { border-color: rgba(70,207,139,0.4); }
.stage-pill.down { border-color: rgba(255,93,93,0.4); }
.bloodline-tag { border-radius: 999px; font-size: 11px; }

/* ---------- 战斗日志 ---------- */
.battle-messages {
  border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 12px 14px; line-height: 1.75;
  font-family: var(--font-game); color: #b9c1d3;
}
.battle-messages .msg { padding: 3px 2px; border-bottom: 1px solid rgba(255,255,255,0.035); }
.battle-messages .msg.msg-turn {
  margin: 9px 0 7px; padding: 0; text-align: center; border-bottom: none;
  color: #d9bf8c; font-size: 11px; letter-spacing: 0.2em; opacity: 0.9;
}
.battle-messages .msg:last-child {
  background: rgba(232,195,122,0.07); border-radius: 8px;
  box-shadow: inset 2px 0 0 var(--gold);
  padding: 4px 8px; color: var(--text);
}

/* ---------- 技能按钮 ---------- */
.battle-actions { gap: 10px; padding: 12px; }
.skill-btn {
  border: 1px solid rgba(255,255,255,0.07); border-radius: 14px;
  background: linear-gradient(160deg, rgba(30,35,52,0.95), rgba(12,15,23,0.96));
  box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
}
.skill-btn::before {
  content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--el, var(--gold));
  opacity: 0.85; box-shadow: 0 0 10px var(--el, var(--gold));
}
.skill-btn:hover:not(:disabled) {
  border-color: var(--el, var(--gold)); transform: translateY(-2px);
  box-shadow: 0 12px 26px rgba(0,0,0,0.45), 0 0 0 1px var(--el, var(--gold));
}
.skill-btn:active:not(:disabled) { transform: translateY(0) scale(0.985); }
.skill-btn-icon {
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.4);
}
.skill-btn-name { letter-spacing: 0.02em; }
.skill-btn-body { font-variant-numeric: tabular-nums; }
.skill-btn-prio { border-radius: 6px; font-size: 11px; }
.struggle-btn { --el: #8f98ab; }
.struggle-btn .skill-btn-name { color: #c9cfdd; }
.action-btn { border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(255,255,255,0.04); }

/* ---------- 换宠 / 弹窗 / 表单 ---------- */
.switch-panel {
  border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  background: rgba(9,11,17,0.94);
  box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
}
.switch-pet-btn { border: 1px solid var(--line-soft); border-radius: 14px; background: rgba(255,255,255,0.03); }
.switch-pet-btn:hover { border-color: var(--line); background: rgba(232,195,122,0.06); }
.modal { border-radius: 20px; border: 1px solid var(--line-soft); }
.modal h3 { letter-spacing: 0.06em; }
.form-group input, .form-group select, .form-group textarea {
  border: 1px solid var(--line-soft); background: rgba(6,8,13,0.7); border-radius: 10px;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,195,122,0.16);
}
.skill-swap-item { border-width: 1px; border-radius: 12px; background: rgba(255,255,255,0.03); }
.skill-swap-item.equipped { border-color: rgba(70,207,139,0.5); background: rgba(70,207,139,0.07); }

/* ---------- 结算 ---------- */
.result-overlay { background: radial-gradient(circle at 50% 40%, rgba(24,19,9,0.78), rgba(3,4,7,0.97)); }
.result-text { font-family: var(--font-game-cn); letter-spacing: 0.2em; }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); }
::-webkit-scrollbar-thumb:hover { background: rgba(232,195,122,0.4); }

/* ---------- 宽屏 ---------- */
@media (min-width: 1024px) {
  #app { max-width: 1440px; }
  .battle-row { gap: 20px; }
  .pet-info-card { width: 100%; max-width: 380px; }
  .skill-btn { min-height: 76px; }
}
@media (max-width: 380px) {
  .skill-btn-name { font-size: 12px; }
  .battle-actions { gap: 8px; padding: 10px; }
  .status-badge { font-size: 10px; padding: 2px 7px; }
}

/* ---------- 无障碍：尊重系统的减弱动效 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- 战场氛围 / 移动端紧凑化 ---------- */
.battle-side .pet-sprite::before {
  content: ''; position: absolute; inset: -16%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,0.07), transparent 66%);
}
.player-side .pet-sprite::before { background: radial-gradient(circle, rgba(108,182,255,0.16), transparent 66%); }
.enemy-side .pet-sprite::before { background: radial-gradient(circle, rgba(255,122,102,0.15), transparent 66%); }
.stage-vs { font-family: var(--font-game-en); font-size: 15px; letter-spacing: 0.3em; color: var(--gold); opacity: 0.55; }

@media (min-width: 1024px) {
  .pet-info-card { max-width: 420px; min-height: 158px; }
}

@media (max-width: 1023px) {
  .battle-row { flex: 1 1 auto; justify-content: space-evenly; padding: 2px 0 0; }
  .battle-side { gap: 2px; }
  .battle-side .pet-sprite { width: 88px; height: 88px; font-size: 42px; }
  .pet-info-card { margin: 2px 10px; padding: 10px 12px; border-radius: 14px; }
  .pet-info-top { margin-bottom: 5px; }
  .pet-info-name { font-size: 15px; }
  .hp-bar-outer { height: 10px; }
  .hp-text { margin-top: 2px; font-size: 11px; }
  .shield-bar-outer { height: 5px; }
  .stage-grid { gap: 3px; }
  .stage-pill { font-size: 10px; padding: 1px 5px; }
  .battle-messages { height: 20vh; min-height: 110px; max-height: 20vh; font-size: 11.5px; padding: 10px 10px 10px 12px; margin: 4px 10px; }
  .battle-actions { padding: 8px 8px 10px; gap: 6px; }
  .battle-actions .skill-btn { min-width: 72px; }
  .battle-actions .action-btn { flex: 0 0 66px; font-size: 11px; padding: 8px 4px; white-space: normal; }
  .skill-btn { min-height: 48px; }
  /* 横排后按钮变窄：内部改纵向堆叠 */
  .battle-actions .skill-btn-header { flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px 0; }
  .battle-actions .skill-btn-icon { width: 26px; height: 26px; font-size: 14px; }
  .battle-actions .skill-btn-name { font-size: 11px; width: 100%; text-align: center; }
  .battle-actions .skill-btn-prio { position: absolute; top: 4px; right: 3px; font-size: 9px; padding: 0 3px; }
  .battle-actions .skill-btn-body { flex-direction: column; gap: 1px; padding: 2px 2px 6px; font-size: 10px; align-items: center; }
  .battle-actions .skill-btn-body .skill-pp-info { margin-left: 0; }
  .battle-actions .skill-btn-body .skill-ext { display: none; }
  .battle-actions .skill-info { right: 3px; bottom: 3px; width: 14px; height: 14px; line-height: 12px; font-size: 9px; }
  .skill-btn-header { padding: 6px 8px 2px; gap: 6px; }
  .skill-btn-icon { width: 32px; height: 32px; font-size: 17px; }
  .skill-btn-name { font-size: 12px; }
  .skill-btn-body { padding: 2px 8px 6px; font-size: 11px; }
  .action-btn { padding: 10px; font-size: 12px; }
  .battle-top { padding: 6px 10px 0; }
  .turn-timer { padding: 3px 10px; }
  .flee-btn { padding: 6px 12px; font-size: 12px; }
}

/* ---------- 窄屏兜底：网格子项允许收缩，避免横向溢出 ---------- */
.battle-actions { display: flex; }
.skill-btn, .skill-btn-name, .pet-info-card, .stage-grid { min-width: 0; }
/* 战斗中弱化右下角设置按钮，避免遮挡技能区 */
body:has(.battle-bg) .settings-btn { opacity: 0.32; transform: scale(0.86); }
body:has(.battle-bg) .settings-btn:hover { opacity: 1; transform: scale(1); }
@media (max-width: 400px) {
  .skill-btn-icon { width: 28px; height: 28px; font-size: 15px; }
  .skill-btn-name { font-size: 11.5px; }
  .skill-btn-prio { font-size: 10px; padding: 1px 5px; }
  .skill-btn-body { font-size: 10.5px; gap: 4px; }
  .skill-btn-body .skill-ext { display: none; }
  .pet-info-top { gap: 3px; }
  .status-badge, .bloodline-tag { font-size: 10px; }
}

/* ---------- 启动页：logo 居中，点击进入主菜单 ---------- */
.intro-screen {
  position: fixed; inset: 0; z-index: 50; outline: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  background:
    radial-gradient(58% 46% at 50% 40%, rgba(232,195,122,0.10), transparent 70%),
    radial-gradient(72% 56% at 50% 108%, rgba(108,182,255,0.06), transparent 72%),
    #070910;
  animation: introIn 0.5s ease;
  transition: opacity 0.62s cubic-bezier(0.4,0,0.2,1), transform 0.62s cubic-bezier(0.4,0,0.2,1), filter 0.62s ease;
}
@keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
.intro-screen.leaving { opacity: 0; transform: scale(1.05); filter: blur(5px); pointer-events: none; }
.intro-screen .intro-logo.menu-logo { margin: 0; }
.intro-screen .intro-logo .roco-mark { width: clamp(184px, 48vw, 248px); height: auto; }
.intro-rule { width: 96px; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
.intro-hint {
  font-size: 11px; letter-spacing: 0.44em; color: var(--text2); text-transform: uppercase;
  animation: introHint 2.8s ease-in-out infinite;
}
@keyframes introHint { 0%,100% { opacity: 0.32; transform: translateY(0); } 50% { opacity: 0.85; transform: translateY(-2px); } }
body:has(#intro-screen) .settings-btn { opacity: 0; pointer-events: none; transform: scale(0.85); }

/* 菜单按钮入场：交叉淡入的后半段 */
@keyframes menuBtnIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.menu-buttons .btn { animation: menuBtnIn 0.52s cubic-bezier(0.22,0.9,0.24,1) backwards; }
.menu-buttons .btn:nth-child(1) { animation-delay: 0.10s; }
.menu-buttons .btn:nth-child(2) { animation-delay: 0.18s; }
.menu-buttons .btn:nth-child(3) { animation-delay: 0.26s; }

/* ---------- 技能详情 ---------- */
.skill-info {
  position: absolute; right: 6px; bottom: 6px; width: 17px; height: 17px; z-index: 3;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.22);
  color: var(--text2); font-size: 10px; line-height: 15px; text-align: center;
  font-family: Georgia, 'Times New Roman', serif; font-style: italic;
  opacity: 0.55; transition: all 0.15s ease;
}
.skill-info:hover { opacity: 1; color: var(--gold); border-color: var(--gold); transform: scale(1.1); }
.swap-info-btn {
  width: 17px; height: 17px; flex: 0 0 17px; margin-left: 6px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.22);
  color: var(--text2); font-size: 10px; line-height: 15px; text-align: center;
  font-family: Georgia, 'Times New Roman', serif; font-style: italic;
  opacity: 0.6; cursor: pointer;
}
.swap-info-btn:hover { opacity: 1; color: var(--gold); border-color: var(--gold); }
.skill-detail { max-width: 460px; }
.skill-detail h3 { margin-bottom: 6px; }
.skill-detail-meta { text-align: center; font-size: 12px; color: var(--text2); letter-spacing: 0.03em; margin-bottom: 14px; }
.skill-detail-body {
  font-size: 13px; line-height: 1.9; color: var(--text); white-space: pre-wrap;
  max-height: 54vh; overflow-y: auto; padding-right: 6px;
}

/* ---------- 战斗日志：类型 + 敌我 ---------- */
.battle-log { position: relative; }
.battle-messages .msg {
  display: flex; gap: 6px; align-items: flex-start;
  padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.msg-side {
  flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px;
  border-radius: 5px; font-size: 10px; font-weight: 800; line-height: 18px; text-align: center;
}
.msg-side.player { background: rgba(232,195,122,0.92); color: #241a07; }
.msg-side.ai { background: rgba(255,122,102,0.92); color: #2b0d08; }
.msg-side:empty { background: transparent; }
.msg-text { flex: 1; min-width: 0; word-break: break-word; }
.msg.side-player .msg-text { border-left: 2px solid rgba(232,195,122,0.34); padding-left: 6px; }
.msg.side-ai .msg-text { border-left: 2px solid rgba(255,122,102,0.34); padding-left: 6px; }
.msg.action .msg-text { color: var(--text); }
.msg.damage .msg-text { color: #ff9d8a; }
.msg.heal .msg-text { color: #7fe0b0; }
.msg.status .msg-text { color: #d9b8ff; }
.msg.system .msg-text { color: var(--text2); }
.msg.turn { justify-content: center; margin: 8px 0 5px; border-bottom: none; }
.msg.turn .msg-side { display: none; }
.msg.turn .msg-text { width: 100%; text-align: center; color: #d9bf8c; font-size: 11px; letter-spacing: 0.18em; }
.battle-messages .msg:last-child { background: rgba(232,195,122,0.06); border-radius: 6px; padding: 3px 4px; }
.log-jump {
  position: absolute; right: 16px; bottom: 12px; z-index: 4;
  padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(12,15,23,0.92);
  color: var(--gold); font-size: 11px; letter-spacing: 0.04em;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
}
.log-jump:hover { background: rgba(232,195,122,0.15); }

/* ---------- 日志工具条 / 标签 / 折叠 ---------- */
.log-tools { display: flex; gap: 4px; justify-content: flex-end; padding: 0 2px 6px; }
.log-tab, .log-copy {
  font-size: 10px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(8,10,16,0.55); color: var(--text2);
}
.log-tab.active { color: #241a07; background: rgba(232,195,122,0.9); border-color: transparent; font-weight: 700; }
.log-tab:hover, .log-copy:hover { border-color: var(--line); color: var(--gold); }
.msg.turn { cursor: pointer; }
.msg.turn .turn-caret { color: var(--text2); font-size: 10px; margin-left: 6px; }
.msg.collapsed { display: none; }
.msg-text b.n { color: #fff; font-weight: 800; }
.tag {
  font-style: normal; font-size: 9.5px; line-height: 1.5; padding: 0 5px; margin-left: 4px;
  border-radius: 999px; border: 1px solid; white-space: nowrap;
}
.tag.crit { color: #ffd479; border-color: rgba(255,212,121,0.55); background: rgba(255,212,121,0.12); }
.tag.super { color: #ff9d8a; border-color: rgba(255,157,138,0.55); background: rgba(255,157,138,0.12); }
.tag.weak { color: #9fb4d0; border-color: rgba(159,180,208,0.45); background: rgba(159,180,208,0.10); }
.tag.immune { color: #9aa3b8; border-color: rgba(154,163,184,0.45); background: rgba(154,163,184,0.10); }

/* 2026-11 · 对战大厅：页面宽度、阅读层级与触摸控件统一收口 */
:root {
  --ui-panel: #131924; --ui-raised: #1a2230; --ui-well: #0d121b;
  --ui-edge: #2b3443; --ui-muted: #a6b0c1;
  --ui-wash: rgba(232,195,122,.07); --ui-blue: #a4c6f0;
}
html { color-scheme: dark; scroll-padding-top: 24px; }
body { align-items: flex-start; background-color: var(--bg); }
#app { max-width: 1280px; overflow: visible; }
.screen { width: 100%; min-height: 100vh; min-height: 100dvh; padding: 32px clamp(16px,4vw,48px) 88px; animation: screenIn .25s ease; }
button { touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.btn, .back-btn, .action-btn, .font-option { min-height: 44px; }
.btn:hover { transform: translateY(-2px); }
.btn-secondary, .action-btn { background: var(--ui-raised); border-color: var(--ui-edge); }
.screen-header { gap: 16px; padding-bottom: 24px; margin-bottom: 24px; }

// ---------- ELEMENT DEFINITIONS ----------
// ---------- ABILITY FORMULA ----------
// 种族值 → 能力值转换
// 能力值 = floor( (种族值×2 + 50) × 等级/100 ) + 等级 + 10
function calcAbility(baseStat, level) { return Math.floor((baseStat * 2 + 50) * level / 100) + level + 10; }
// 精力独特公式：通用公式 + 100（替代装备系统的精力加成）
function calcHpAbility(baseStat, level) { return calcAbility(baseStat, level) + 100; }
function calcAllStats(baseStats, level) { return { hp: calcHpAbility(baseStats.hp, level), atk: calcAbility(baseStats.atk, level), def: calcAbility(baseStats.def, level), spatk: calcAbility(baseStats.spatk, level), spdef: calcAbility(baseStats.spdef, level), spd: calcAbility(baseStats.spd, level) }; }
// 能力值→种族值反推（用于编辑界面输入能力值后存储种族值）
function abilityToBase(ability, level, isHp) {
  var hpBonus = isHp ? 100 : 0;
  var base = ((ability - hpBonus - level - 10) * 100 / level - 50) / 2;
  return Math.max(0, Math.round(base));
}

    setField: function(type, turns) { gameState.field = type; gameState.fieldTurns = turns; addMessage("环境变更为" + ({"dream":"梦境","shunhua":"瞬华"}[type]||type) + "！持续"+turns+"回合"); },
    addCritBonus: function(target, amount, turns) { target.critRateBonus = (target.critRateBonus || 0) + amount; var self = this; setTimeout(function() { target.critRateBonus = Math.max(0, (target.critRateBonus || 0) - amount); }, turns * 1000 || 2000); },
    invertHealing: function(target, pct, turns) { target.healInvertPct = pct; target.healInvertTurns = turns; addMessage(target.name + "的治疗被倒置"+Math.round(pct*100)+"%持续"+turns+"回合！"); },

// PP 恢复统一入口：immuneToPP / noPPRecover / ppLocked / blockPPRecovery 均在此判定
function gainPP(pet, skill, amount) {
  if (!skill || amount <= 0) return 0;
  if (pet && pet.blockPPRecovery) return 0;
  if (skill.immuneToPP || skill.noPPRecover) return 0;
  var before = skill.pp;
  skill.pp = Math.min(skill.maxPp, skill.pp + amount);
  return skill.pp - before;
}

function processBloodlines() {
  var ctx = createBattleContext();
  [gameState.playerActive, gameState.aiActive].forEach(function(pet) {

// 残念余梦的封存 PP 只在真正的残脉→清念转换时恢复一次。
function enterQingyuMode(pet, mode) {
  var bd = pet.bloodlineData || (pet.bloodlineData = {});
  var previous = bd.mode;
  bd.mode = mode;
  if (previous === "残脉" && mode === "清念" && bd.qy3SavedPP !== undefined) {
    var skill = pet.skills.find(function(s) { return s.id === "sk_qy_3"; });
    if (skill) skill.pp = Math.min(skill.maxPp, bd.qy3SavedPP);

  }
}

function getSkillPower(skill, power) {
  return power * (1 - (skill ? skill.qingnianPowerLoss || 0 : 0));
}

function getSkillPriority(skill) {

}

function applyQingnianSuppression(pet, skill) {
  if (pet.qingnianWindowEnd === undefined || gameState.turnCount > pet.qingnianWindowEnd || skill.__struggle) return;
  if (skill.category === "status") {

    addMessage("【清念沉脉】" + pet.name + " 的" + skill.name + "先手永久-1！");
  } else {
    skill.qingnianPowerLoss = Math.min(0.5, (skill.qingnianPowerLoss || 0) + 0.3);
    addMessage("【清念沉脉】" + pet.name + " 的" + skill.name + "威力永久削弱" + Math.round(skill.qingnianPowerLoss * 100) + "%！");
  }
}

function processTurnEffects(pet) {
  if (!pet || pet.isFainted()) return;
  // 先快照再清空：onTick 内注册的新效果写入新数组，不会被本轮结果覆盖
  var queue = pet.turnEffects.slice();
  pet.turnEffects = [];
  queue.forEach(function(e) {
    if (!e) return;
    if (e.onTick) e.onTick(pet);
    e.turnsLeft--;
    if (e.turnsLeft <= 0) { if (e.onExpire) e.onExpire(pet); }
    else pet.turnEffects.push(e);
  });
  // Decrement damage cap turns
  if (pet.damageCapTurns > 0) pet.damageCapTurns--;
  if (pet.damageReductionTurns > 0) pet.damageReductionTurns--;
  if (pet.healInvertTurns > 0) pet.healInvertTurns--;
  // 保留既有封锁结束点：上一回合施加的封锁仍覆盖本回合开场回复。
  pet.blockPPRecovery = false;
}

function postDamageProcessing() {
  // Check lethal hit survival (不灭魂体 mechanic)
  [gameState.playerActive, gameState.aiActive].forEach(function(pet) {
    if (!pet || !pet.bloodline) return;
    if (pet.lethalHitThisTurn && pet.bloodline.name === "不灭魂体" && !pet.lethalHandled) {
      pet.lethalHandled = true;
      pet.hp = 1;
      pet.skills.forEach(function(s) { if (!s.immuneToPP) s.pp = Math.max(0, s.pp - 4); });
      addMessage(pet.name + " 被致命一击！不灭魂体保留1点精力！全体技能-4PP！");

      forceSwitchPet(pet);
    }
  });
}

function forceSwitchPet(pet) {
  if (pet.immuneEject) { addMessage(pet.name + " 免疫了驱逐效果！"); return; }
  var party = gameState.playerActive === pet ? gameState.playerParty : gameState.aiParty;
  var candidates = party.filter(function(p) { return !p.isFainted() && p !== pet; });
  if (!candidates.length) return;
  var next = candidates[Math.floor(Math.random() * candidates.length)];
  if (gameState.playerActive === pet) {
    if (gameState.playerActive) gameState.playerActive.qlSealMark = false;
    addMessage(pet.name + " 被迫换下！"); gameState.playerActive = next; addMessage("换上 " + next.name + "！");
  } else {
    addMessage(pet.name + " 被迫换下！"); gameState.aiActive = next; addMessage("对手换上 " + next.name + "！");
  }
  renderBattle(document.querySelector("#app"));
}

// ---------- TURN TIMER ----------
var TURN_TIME_LIMIT = 20;
function startTurnTimer() {
  gameState.turnTimeLeft = TURN_TIME_LIMIT;
  var td = document.querySelector("#turn-timer");
  var fill = document.querySelector("#turn-timer-fill");

    }

    if (gameState.turnTimeLeft <= 0) {
      clearInterval(gameState.turnTimer);
      if (td) td.style.display = "none";
      var p = gameState.playerActive;
      if (p && !p.isFainted() && !gameState.battleOver) {
        var picked = false;
        for (var i = 0; i < p.skills.length; i++) {
          if (p.skills[i].pp > 0) { playerUseSkill(i); picked = true; return; }
        }
        if (!picked) {
          // PP全空且未换宠：默认不使用任何技能（空过回合）
          gameState.pendingPlayerSkill = null;

}

}

function processWeather() {
  if (!gameState.weather || gameState.weatherTurns <= 0) return;
  var p = gameState.playerActive, a = gameState.aiActive;
  switch(gameState.weather) {
    case "sandstorm":
      [p,a].forEach(function(pet) {

          pet.takeDamage(Math.floor(pet.maxHp / 16));

    case "hailstorm":

          pet.takeDamage(Math.floor(pet.maxHp / 16));
          addMessage("冰雹砸落" + pet.name + "！");
        }
      });
      break;
  }
}

function getWeatherDamageMod(atkEl, defEl) {
  if (!gameState.weather) return 1.0;
  switch(gameState.weather) {
    case "sunny": return atkEl === "fire" ? 1.5 : atkEl === "water" ? 0.5 : 1.0;
    case "rainy": return atkEl === "water" ? 1.5 : atkEl === "fire" ? 0.5 : 1.0;
    default: return 1.0;
  }
}

// ---------- LEGACY FUNCTIONS ----------
function calcDamage(attacker, defender, skill) {
  if (skill.power === 0) return { damage: 0, effectiveness: 1, isCrit: false };
  if (defender.immunePowerDamage && skill.power > 0) return { damage: 0, effectiveness: 1, isCrit: false };
  var isPhysical = skill.category === "physical";
  var atkStat = isPhysical ? attacker.getStat("atk") : attacker.getStat("spatk");
  var defStat = isPhysical ? defender.getStat("def") : defender.getStat("spdef");
  var dmg = Math.floor(((2 * attacker.level / 5 + 2) * getSkillPower(skill, skill.power) * (atkStat / defStat)) / 50 + 2);
  dmg = Math.floor(dmg * (0.85 + Math.random() * 0.15));
  if (skill.element === (attacker.skillElementOverride || attacker.element)) dmg = Math.floor(dmg * 1.5);
  var eff = getEffectiveness(skill.element, defender.element);
  dmg = Math.floor(dmg * eff);
  dmg = Math.floor(dmg * getWeatherDamageMod(skill.element, defender.element));
  var isCrit = false;
  if (skill.category !== "status" && Math.random() < (0.0625 + (attacker.critRateBonus || 0)) && !attacker.preventCritNext) { dmg = Math.floor(dmg * 1.5); isCrit = true; }
  if (attacker.preventCritNext) attacker.preventCritNext = false;
  if (attacker.status === "burn" && isPhysical) dmg = Math.floor(dmg * 0.5);
  dmg = Math.floor(dmg * (attacker.dmgMod || 1));
  if (attacker.outputReduction > 0) dmg = Math.floor(dmg * (100 - attacker.outputReduction) / 100);
  return { damage: Math.max(1, dmg), effectiveness: eff, isCrit: isCrit };
}

function applyEffect(pet, effect) {
  if (pet.statusImmunities && pet.statusImmunities.indexOf(effect) >= 0) { var sn=({burn:"烧伤",freeze:"冰冻",paralyze:"麻痹",poison:"中毒",sleep:"睡眠",fear:"恐惧",bind:"束缚",confuse:"混乱"}[effect]||effect); addMessage(pet.name + "免疫了"+sn+"！"); return; }
  if (pet.status && effect !== "confuse" && effect !== "bind") return;
  switch(effect) {
    case "burn": pet.status = "burn"; addMessage(pet.name + " 烧伤了！"); break;
    case "freeze": pet.status = "freeze"; pet.statusTurns = 0; addMessage(pet.name + " 被冰冻了！"); break;
    case "paralyze": pet.status = "paralyze"; addMessage(pet.name + " 麻痹了！"); break;
    case "poison": pet.status = "poison"; addMessage(pet.name + " 中毒了！"); break;
    case "sleep": pet.status = "sleep"; pet.statusTurns = 1 + Math.floor(Math.random() * 3); addMessage(pet.name + " 睡着了！"); break;
    case "confuse": pet.confuseTurns = 2 + Math.floor(Math.random() * 3); addMessage(pet.name + " 混乱了！"); break;
    case "fear": pet.status = "fear"; pet.statusTurns = 1 + Math.floor(Math.random() * 2); addMessage(pet.name + " 被恐惧了！"); break;
    case "bind": pet.bindTurns = 2 + Math.floor(Math.random() * 4); addMessage(pet.name + " 被束缚了！"); break;
  case "leech_seed": pet.leechSeed = true; addMessage(pet.name + " 被寄生种子缠住了！"); break;
  }
}



// ---------- HELPERS ----------
function $(sel) { return document.querySelector(sel); }
// 文本高亮：把关键词变成标签，数字加粗
function decorateMessage(text) {

    .replace(/命中要害/g, '<i class="tag crit">暴击</i>')
    .replace(/效果拔群/g, '<i class="tag super">克制</i>')

function renderBattleLog() {
  var msgs = document.querySelector("#battle-messages");
  if (!msgs) return;
  var jump = document.querySelector("#log-jump");
  var atBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 40;
  var prevTop = msgs.scrollTop;
  var arr = gameState.messages.slice(-200);
  var filter = gameState.logFilter || "all";
  var collapsed = null;
  var out = "";
  arr.forEach(function(raw) {
    var m = typeof raw === "string" ? { text: raw, type: classifyMessage(raw), side: "system", turn: 0 } : raw;
    var type = m.type || "system", side = m.side || "system";
    if (filter === "action" && type === "system") return;
    if (filter === "system" && type !== "system" && type !== "turn") return;
    if (type === "turn") {
      collapsed = (gameState.logCollapsed && gameState.logCollapsed[m.turn]) ? m.turn : null;
      out += '<div class="msg turn' + (collapsed !== null ? " turn-collapsed" : "") + '" data-turn="' + m.turn + '"><span class="msg-text">' + escapeHtml(m.text) + '</span><span class="turn-caret">' + (collapsed !== null ? "▸" : "▾") + '</span></div>';
      return;
    }
    var hidden = collapsed !== null && m.turn === collapsed;
    var badge = side === "player" ? '<span class="msg-side player">我</span>' : side === "ai" ? '<span class="msg-side ai">敌</span>' : '<span class="msg-side"></span>';
    out += '<div class="msg ' + type + ' side-' + side + (hidden ? " collapsed" : "") + '">' + badge + '<span class="msg-text">' + decorateMessage(m.text) + '</span></div>';
  });
  if (!out) out = '<div class="msg system"><span class="msg-side"></span><span class="msg-text">暂无记录</span></div>';
  msgs.innerHTML = out;
  if (atBottom) msgs.scrollTop = msgs.scrollHeight; else msgs.scrollTop = prevTop;
  if (jump) jump.hidden = atBottom;
  Array.prototype.forEach.call(document.querySelectorAll(".log-tab"), function(b) {
    b.classList.toggle("active", b.getAttribute("data-filter") === filter);

}

function copyBattleLog() {
  var text = gameState.messages.map(function(m) { return typeof m === "string" ? m : m.text; }).join("\n");
  var btn = document.querySelector("#log-copy");
  var done = function() { if (!btn) return; var old = btn.textContent; btn.textContent = "已复制"; setTimeout(function() { btn.textContent = old; }, 1200); };
  var fallback = function() {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

// ---------- 战斗日志消息 ----------
// 统一消息模型：{ text, type: action|damage|heal|status|system|turn, side: player|ai|system, turn }
function classifyMessage(text) {
  var s = String(text);
  if (/^━+/.test(s)) return "turn";
  if (/造成|伤害|固伤|反伤|攻击了自己/.test(s)) return "damage";
  if (/回复|治疗|护盾|吸收了/.test(s)) return "heal";
  if (/免疫|陷入|混乱|烧伤|冰冻|麻痹|中毒|睡眠|恐惧|束缚|寄生|强化|提升|降低|级/.test(s)) return "status";
  if (/天气|环境|回合|换宠|换上|先手|后手|倒下了|战斗开始|逃跑|解除/.test(s)) return "system";
  return "action";
}
function addMessage(msg, type, side) {
  var text = String(msg);
  gameState.messages.push({
    text: text,
    type: type || classifyMessage(text),
    side: side || gameState.currentActingSide || "system",
    turn: gameState.turnCount || 0
  });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function spawnFloatText(pet, text, type) {
  var spriteId = (gameState.playerActive === pet) ? "#player-sprite" : "#ai-sprite";
