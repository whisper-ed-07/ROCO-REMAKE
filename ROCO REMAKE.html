<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20170%20110%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220.5%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffe9a8%22%2F%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%23e2b04a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23b8841a%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22b%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220.5%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23d9b45c%22%2F%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%23a8801f%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%236d5210%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M22%2C14%20V86%20M22%2C14%20H54%20A20%2C20%200%200%201%2054%2C54%20H22%20M48%2C54%20L76%2C86%22%20stroke%3D%22url(%23b)%22%20transform%3D%22translate(52%2C20)%20rotate(-13%2038%2042)%22%2F%3E%3Cpath%20d%3D%22M22%2C14%20V86%20M22%2C14%20H54%20A20%2C20%200%200%201%2054%2C54%20H22%20M48%2C54%20L76%2C86%22%20stroke%3D%22url(%23a)%22%20transform%3D%22translate(24%2C0)%20rotate(11%2038%2042)%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>ROCO REMAKE — 洛克王国：对战重置版</title>
<style>
:root {
  --bg: #0d1117; --surface: #1a1f2e; --surface2: #252b3a;
  --text: #f0e6d3; --text2: #a09880; --accent: #f0725a;
  --accent2: #ff8a70; --gold: #e2b04a; --green: #4caf84;
  --hp-green: #3fb950; --hp-yellow: #e2b04a; --hp-red: #f85149;
  --shield-color: #58a6ff; --border: #3a3440; --radius: 14px;
  --motion-fast: 120ms; --motion-state: 140ms; --motion-panel: 180ms;
  --motion-page: 200ms; --motion-intro: 360ms; --motion-result: 220ms;
  --motion-hp: 280ms; --motion-ghost: 420ms; --motion-ghost-delay: 80ms; --motion-float: 700ms; --ease-enter: cubic-bezier(.2,.7,.2,1);
  --shadow: 0 6px 24px rgba(0,0,0,0.6);
  --glow-gold: 0 0 16px rgba(226,176,74,0.3);
  --glow-accent: 0 0 16px rgba(240,114,90,0.3);
  --font-game: 'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;
  --font-game-cn: 'Noto Serif SC','Microsoft YaHei',serif;   /* 全局中文字体 */
  --font-game-en: 'Cinzel',sans-serif;                        /* 全局英文字体 */
}

* { margin:0; padding:0; box-sizing:border-box; }

/* ===== 设置面板 ===== */
.settings-btn {
  position: fixed; bottom: 14px; right: 14px; z-index: 60;
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  background: rgba(26,31,46,0.75); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15); color: var(--text);
  font-size: 20px; transition: all 0.2s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
@media (hover: hover) { .settings-btn:hover { transform: scale(1.1) rotate(45deg); border-color: var(--gold); } }
/* ===== 流动特效 ===== */
@keyframes flowGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes auroraDrift {
  0% { transform: translateX(-20%) translateY(0) rotate(0deg); opacity: 0.5; }
  50% { transform: translateX(20%) translateY(-30px) rotate(10deg); opacity: 0.9; }
  100% { transform: translateX(-20%) translateY(0) rotate(0deg); opacity: 0.5; }
}
@keyframes particleFloat {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 0.8; }
  100% { transform: translateY(-60vh); opacity: 0; }
}
@keyframes titleShine {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes logoSpin {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(8deg) scale(1.08); }
  50% { transform: rotate(-4deg) scale(1.05); }
  75% { transform: rotate(4deg) scale(1.1); }
  100% { transform: rotate(0deg) scale(1); }
}

/* 主菜单背景流动 */
.menu-screen-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(120deg, #0a0e14, #101a2e, #1a1030, #0d1f17, #0a0e14);
  background-size: 400% 400%;
  animation: flowGradient 15s ease infinite;
}
/* 极光光带 */
.aurora-band {
  position: absolute; height: 60px; border-radius: 50%; filter: blur(40px);
  animation: auroraDrift 12s ease-in-out infinite;
}
.aurora-band.b1 { width: 70%; left: -10%; top: 15%; background: rgba(88,166,255,0.18); }
.aurora-band.b2 { width: 55%; left: 30%; top: 45%; background: rgba(226,176,74,0.12); animation-delay: 4s; }
.aurora-band.b3 { width: 65%; left: 10%; top: 70%; background: rgba(240,114,90,0.14); animation-delay: 8s; }
/* 浮游粒子 */
.particle {
  position: absolute; bottom: -10px; border-radius: 50%;
  background: rgba(226,176,74,0.6);
  animation: particleFloat linear infinite;
}

body {
  font-family: var(--font-game-en), var(--font-game-cn), var(--font-game), sans-serif;
  background: #0a0e14; color: var(--text);
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 25% 40%, rgba(240,114,90,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 30%, rgba(88,166,255,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 85%, rgba(76,175,132,0.04) 0%, transparent 50%);
  background-attachment: fixed;
}

#app { width: 100%; max-width: 520px; min-height: 100vh; position: relative; overflow: hidden; }

.screen {
  display: none; flex-direction: column; min-height: 100vh;
  padding: 20px 16px;
}
.screen.active { display: flex; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes screenOut {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.96); }
}
@keyframes fadeInSprite {
  0% { filter: brightness(0%); transform: scale(0.8); }
  60% { filter: brightness(120%); }
  100% { filter: brightness(100%); transform: scale(1); }
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
@keyframes glowPulse { 0%,100% { box-shadow: 0 0 8px rgba(226,176,74,0.2); } 50% { box-shadow: 0 0 24px rgba(226,176,74,0.5); } }
@keyframes hpShine { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes faintOut {
  0% { opacity: 1; filter: brightness(100%); }
  50% { opacity: 0.5; filter: brightness(200%) saturate(0%); }
  100% { opacity: 0; filter: brightness(300%) saturate(0%); transform: scale(0.3); }
}

/* Menu */
.menu-header { text-align: center; padding: 50px 0 30px; }
.menu-card { background: rgba(26,31,46,0.4); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 12px; margin: 0 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
.menu-logo { margin-bottom: 14px; display: inline-block; animation: rGlow 3.4s ease-in-out infinite; }
.menu-logo .roco-mark { width: 150px; height: 97px; display: block; overflow: visible; }
.menu-logo .r-back { animation: rBackSway 3.6s ease-in-out infinite; transform-origin: 90px 62px; }
.menu-logo .r-front { animation: rFrontSway 3.6s ease-in-out infinite; transform-origin: 62px 42px; }
@keyframes rFrontSway {
  0%, 100% { transform: translate(24px, 0) rotate(11deg); }
  50% { transform: translate(24px, -6px) rotate(6deg); }
}
@keyframes rBackSway {
  0%, 100% { transform: translate(52px, 20px) rotate(-13deg); }
  50% { transform: translate(52px, 13px) rotate(-7deg); }
}
@keyframes rGlow {
  0%, 100% { filter: drop-shadow(0 6px 16px rgba(226,176,74,0.32)); }
  50% { filter: drop-shadow(0 10px 28px rgba(226,176,74,0.62)); }
}
.menu-title-cn {
  font-family: var(--title-font-cn, 'Noto Serif SC', 'Microsoft YaHei', serif);
  font-weight: 900; font-size: 26px; letter-spacing: 3px; margin-bottom: 6px;
  background: linear-gradient(120deg, #f0c060, #fff7e0 40%, #e2b04a 60%, #f0c060);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: titleShine 4s linear infinite;
  text-shadow: 0 0 30px rgba(226,176,74,0.3);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.menu-title-en {
  font-family: var(--title-font-en, 'Cinzel'), serif; font-weight: 900;
  font-size: 17px; letter-spacing: 6px; margin-top: 4px;
  background: linear-gradient(180deg, #e8e8f0, #9aa8c0 60%, #6a7a96);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-transform: uppercase;
}
.menu-title {
  font-family: 'Press Start 2P', var(--font-game);
  font-size: 20px; font-weight: 400;
  background: linear-gradient(180deg, var(--gold) 0%, #f0c060 40%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 8px; letter-spacing: 2px; text-shadow: none;
}
.menu-subtitle { font-size: 12px; color: var(--text2); letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; }
.menu-buttons { display: flex; flex-direction: column; gap: 14px; padding: 20px 10px; flex: 1; justify-content: center; }

.btn {
  padding: 16px 28px; border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.2s ease; letter-spacing: 1px;
  position: relative; overflow: hidden;
}
/* ===== 触摸友好：通用按钮最小高度 ===== */
button { min-height: 36px; }

/* ===== 全局字体继承：表单控件默认不继承 body 字体，必须显式声明 ===== */
button, input, select, textarea, .btn { font-family: inherit; }

/* ===== 键盘焦点可见（可访问性） ===== */
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px;
}

@media (hover: hover) { .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow); } }
.btn:active { transform: translateY(0) scale(0.98); }
.btn-primary { background: linear-gradient(135deg, #f85149, #da3633); color: #fff; box-shadow: 0 4px 16px rgba(248,81,73,0.3); }
@media (hover: hover) { .btn-primary:hover { box-shadow: 0 6px 28px rgba(248,81,73,0.5); } }
.btn-secondary { background: var(--surface2); color: var(--text); border: 2px solid var(--border); }
@media (hover: hover) { .btn-secondary:hover { border-color: var(--accent); background: var(--surface); } }
.btn-small { padding: 9px 18px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Screen header */
.screen-header { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.screen-header .back-btn {
  background: none; border: 2px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
@media (hover: hover) { .screen-header .back-btn:hover { background: var(--surface2); border-color: var(--gold); } }
.screen-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

/* Team select */
.pet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; overflow-y: auto; padding-bottom: 16px; align-content: safe center; }
.pet-card {
  background: rgba(26,31,46,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius); padding: 18px 12px; min-height: 132px; cursor: pointer;
  transition: all 0.25s ease; text-align: center; position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
@media (hover: hover) { .pet-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow); } }
.pet-card.selected {
  border-color: var(--gold);
  box-shadow: var(--glow-gold);
  animation: glowPulse 2s infinite;
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.pet-card-emoji { font-size: 44px; margin-bottom: 6px; display: block; }
.pet-card-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.pet-card-element { font-size: 12px; opacity: 0.8; }
.pet-card-check { position: absolute; top: 8px; right: 10px; color: var(--gold); font-size: 22px; display: none; }
.pet-card.selected .pet-card-check { display: block; }
.team-ready-bar { padding: 20px 0; text-align: center; }
.selected-count { font-size: 14px; color: var(--text2); margin-bottom: 12px; }

/* Battle */
.battle-bg {
  background: linear-gradient(180deg, #0d1f17 0%, #121a24 35%, #0a0e14 100%);
  min-height: 100vh; display: flex; flex-direction: column; position: relative;
}
.battle-ground { width: 70%; height: 3px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); border-radius: 2px; margin: 10px 0; }

.pet-sprite {
  width: 100px; height: 100px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; position: relative; transition: all 0.3s ease;
  animation: none;
}
.pet-sprite.opponent { background: radial-gradient(circle, rgba(248,81,73,0.1) 0%, transparent 70%); }
.pet-sprite.player { background: radial-gradient(circle, rgba(88,166,255,0.1) 0%, transparent 70%); }
.pet-sprite.hit { animation: battleHit var(--motion-panel) ease; }
.pet-sprite.pet-enter { animation: petEnter var(--motion-panel) var(--ease-enter); }
@keyframes battleHit { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
@keyframes petEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.pet-sprite::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:96px; height:14px; border-radius:50%; background:radial-gradient(ellipse, rgba(226,176,74,0.30) 0%, transparent 72%); filter:blur(3px); pointer-events:none; }
.pet-sprite.fainted { animation: faintOut 1.2s ease forwards; }

.stage-grid { display:flex; flex-wrap:wrap; gap:4px; }
.pet-info-card {
  background: rgba(26,31,46,0.55);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-radius: var(--radius); padding: 16px 20px; margin: 8px 16px;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  min-width: 220px; position: relative;
}
.pet-info-card::before {
  content:""; position:absolute; top:0; left:12px; right:12px; height:1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  pointer-events:none;
}
.pet-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
.pet-info-name { font-weight: 800; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.pet-info-lv { font-size: 12px; color: var(--text2); background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.pet-info-element { font-size: 12px; padding: 3px 10px; border-radius: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }

.hp-bar-outer { width: 100%; height: 14px; background: #1a1f2a; border-radius: 7px; overflow: hidden; position: relative; margin-top: 4px; border: 2px solid #3a3440; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
.hp-bar-inner { height: 100%; border-radius: 5px; transition: width var(--motion-hp) ease; position: relative; z-index: 1; }
.hp-bar-ghost { position: absolute; top:0; bottom:0; left:0; background: rgba(255,255,255,0.25); border-radius: 5px; transition: width var(--motion-ghost) ease var(--motion-ghost-delay); z-index: 0; }
.hp-bar-inner::after { content:''; position:absolute; top:0;left:0;right:0;height:40%; background:rgba(255,255,255,0.2); border-radius:5px 5px 0 0; }
.hp-bar-inner { background: var(--hp-green); }
.hp-bar-inner.low { background: var(--hp-yellow); }
.hp-bar-inner.critical { background: var(--hp-red); }

.shield-value { font-size: 12px; color: var(--shield-color); text-align: right; margin-top: 2px; font-weight: 700; letter-spacing: 0.5px; }
.shield-bar-outer { width: 100%; height: 8px; background: #1a1f2a; border-radius: 4px; overflow: hidden; margin-top: 3px; border: 1px solid #3a3440; }
.shield-bar-inner { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #58a6ff, #79c0ff); transition: width var(--motion-hp) ease; box-shadow: 0 0 8px rgba(88,166,255,0.3); }

.hp-text { font-size: 12px; color: var(--text2); text-align: right; margin-top: 3px; font-weight: 600; letter-spacing: 0.5px; }
.marks-display { font-size: 12px; color: var(--gold); margin-top: 2px; }

.status-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 8px; margin-left: 6px; font-weight: 700; letter-spacing: 0.5px; }
.status-badge.burn { background: linear-gradient(135deg,#f08030,#e05a1a); color:#fff; }
.status-badge.freeze { background: linear-gradient(135deg,#98d8d8,#68b8b8); color:#1a1a2e; }
.status-badge.paralyze { background: linear-gradient(135deg,#f8d030,#e0b010); color:#1a1a2e; }
.status-badge.poison { background: linear-gradient(135deg,#a040a0,#802080); color:#fff; }
.status-badge.sleep { background: linear-gradient(135deg,#7060a0,#504080); color:#fff; }
.status-badge.confuse { background: linear-gradient(135deg,#e0c068,#c0a040); color:#1a1a2e; }
.status-badge.fear { background: linear-gradient(135deg,#8b0000,#5a0000); color:#fff; }
.status-badge.bind { background: linear-gradient(135deg,#666,#444); color:#fff; }
.status-badge.immune { background: linear-gradient(135deg,#3fb950,#2a8f43); color:#fff; }

.battle-messages { margin: 4px 16px; background: rgba(10,14,20,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: var(--radius); padding: 10px 14px; max-height: 260px; min-height: 160px; overflow-y: auto; font-size: 12px; color: var(--text2); line-height: 1.7; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
.battle-messages .msg:last-child { color: var(--text); font-weight: 600; background: rgba(226,176,74,0.06); border-radius: 4px; padding: 2px 6px; }
.battle-messages .msg { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.battle-messages .msg:last-child { border-bottom: none; }

.battle-actions { padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skill-btn {
  padding: 0; border-radius: 12px; cursor: pointer;
  font-size: 12px; font-weight: 600; transition: all 0.2s ease;
  text-align: left; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  border: 2px solid transparent;
  background: linear-gradient(rgba(26,31,46,0.85), rgba(26,31,46,0.85)) padding-box,
              linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.08)) border-box;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
@media (hover: hover) { .skill-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 24px rgba(0,0,0,0.4); border-color: rgba(240,114,90,0.6); } }
.skill-btn.no-pp { opacity: 0.25; pointer-events: none; }

.skill-btn-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; }
.skill-btn-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); overflow: hidden; }
/* ===== 官方属系图标 ===== */
.elem-ico { width: 100%; height: 100%; object-fit: contain; display: block; }
.elem-ico-sm { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; display: inline-block; }
.elem-ico-md { width: 22px; height: 22px; object-fit: contain; vertical-align: -5px; display: inline-block; }
.skill-btn-name { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skill-btn-prio { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.skill-btn-prio.fast { background: rgba(63,185,80,0.2); color: #3fb950; }
.skill-btn-prio.slow { background: rgba(248,81,73,0.2); color: #f85149; }
.skill-btn-prio.normal { background: rgba(139,148,158,0.15); color: #8b949e; }

.skill-btn-body { display: flex; align-items: center; gap: 6px; padding: 4px 10px 8px; font-size: 12px; color: var(--text2); }
.skill-btn-body .skill-power { font-weight: 600; color: #e6ed3f; }
.skill-btn-body .skill-pp-info { margin-left: auto; }
.skill-btn-body .skill-ext { color: var(--gold); margin-left: 4px; }
.skill-btn-body .pp-empty { color: var(--hp-red); font-weight: 700; }

.action-btn { padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s ease; text-align: center; }
@media (hover: hover) { .action-btn:hover { border-color: var(--gold); background: rgba(226,176,74,0.1); transform: scale(1.02); } }

.switch-panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(10,14,20,0.85); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-top: 1px solid rgba(255,255,255,0.1); padding: 20px; display: none; flex-direction: column; gap: 10px; z-index: 10; animation: screenIn 0.25s ease; max-height: 60vh; overflow-y: auto; }
.switch-panel.show { display: flex; }
.switch-pet-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
@media (hover: hover) { .switch-pet-btn:hover { border-color: var(--accent); background: var(--surface2); transform: scale(1.02); } }
.switch-pet-btn.fainted { opacity: 0.35; }
.switch-pet-btn .switch-emoji { font-size: 26px; }

/* Management */
.mgmt-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.mgmt-tab { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 10px; background: transparent; color: var(--text2); cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; transition: all 0.2s ease; }
.mgmt-tab.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }
.mgmt-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; justify-content: safe center; }
.mgmt-item {
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border: 2px solid var(--border); border-radius: var(--radius);
  padding: 14px; display: flex; align-items: center; gap: 14px;
  transition: all 0.2s ease;
}
@media (hover: hover) { .mgmt-item:hover { border-color: var(--accent); transform: translateX(4px); box-shadow: var(--shadow); } }
.mgmt-item-emoji { font-size: 34px; min-width: 44px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.mgmt-item-info { flex: 1; }
.mgmt-item-name { font-weight: 700; font-size: 15px; }
.mgmt-item-detail { font-size: 12px; color: var(--text2); margin-top: 3px; }
.mgmt-item-actions { display: flex; gap: 8px; }
.mgmt-item-actions button { padding: 6px 12px; min-height: 40px; min-width: 64px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-size: 12px; transition: all 0.2s ease; }
@media (hover: hover) { .mgmt-item-actions button:hover { border-color: var(--accent); transform: scale(1.05); } }
.add-btn { padding: 16px; border: 2px dashed var(--border); border-radius: var(--radius); background: transparent; color: var(--text2); cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s ease; text-align: center; }
@media (hover: hover) { .add-btn:hover { border-color: var(--accent); color: var(--accent); } }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: rgba(20,24,36,0.9); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.12); animation: screenIn 0.3s ease; box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); }
.modal h3 { font-size: 20px; margin-bottom: 20px; text-align: center; color: var(--gold); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; transition: all 0.2s ease; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,114,90,0.15); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group select { cursor: pointer; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat-grid .form-group { margin-bottom: 8px; }
.stat-grid input { text-align: center; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.form-actions button { flex: 1; }

/* Result */
.result-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 24px; backdrop-filter: blur(8px); }
.result-overlay.show { display: flex; }
.result-emoji { font-size: 96px; animation: pulse 1s ease-in-out infinite; }
.result-text { font-size: 36px; font-weight: 900; text-align: center; letter-spacing: 2px; }
.result-text.win { color: var(--gold); text-shadow: 0 0 40px rgba(226,176,74,0.5); }
.result-text.lose { color: var(--accent); text-shadow: 0 0 40px rgba(248,81,73,0.5); }

/* Skill swap */
.skill-swap-list { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
.skill-swap-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; transition: all 0.2s ease; }
@media (hover: hover) { .skill-swap-item:hover { border-color: var(--gold); transform: scale(1.02); } }
.skill-swap-item.equipped { border-color: var(--green); background: rgba(63,185,80,0.08); }
.swap-move { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text2); font-size: 12px; padding: 2px 6px; cursor: pointer; line-height: 1.2; }
@media (hover: hover) { .swap-move:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); } }
.swap-move:disabled { opacity: 0.35; cursor: default; }
.skill-swap-item .swap-info { margin-left: auto; font-size: 12px; color: var(--text2); }
.swap-move { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text2); font-size: 12px; padding: 2px 6px; cursor: pointer; line-height: 1.2; }
@media (hover: hover) { .swap-move:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); } }
.swap-move:disabled { opacity: 0.35; cursor: default; }
.skill-swap-item .swap-info { margin-left: auto; font-size: 12px; color: var(--text2); }
.pet-detail-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 8px 0; }
.pet-detail-card h3 { margin-bottom: 14px; text-align: center; font-size: 18px; }

.turn-indicator { text-align:center;padding:8px;margin:4px 16px;background:linear-gradient(180deg,rgba(226,176,74,0.12),rgba(226,176,74,0.04));border:1px solid rgba(226,176,74,0.3);border-radius:8px;font-weight:900;font-size:14px;color:var(--gold);letter-spacing:2px; }
.turn-timer { display:flex;align-items:center;gap:8px;margin:4px 16px;padding:6px 12px;background:rgba(10,14,20,0.5);backdrop-filter:blur(8px);border-radius:8px;font-size: 12px;color:var(--text2);border:1px solid rgba(255,255,255,0.06); }
.turn-timer #turn-timer-text { font-weight:800; min-width:34px; text-align:center; font-size:12px; color:var(--gold); }
.turn-timer-bar { flex:1;height:4px;background:#1a1f2a;border-radius:2px;overflow:hidden; }
.turn-timer-fill { height:100%;border-radius:2px;background:var(--green);transition:width 1s linear; }
.turn-timer-fill.warning { background:var(--hp-yellow); }
.turn-timer-fill.danger { background:var(--hp-red);animation:pulse 0.5s infinite; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
@media (hover: hover) { ::-webkit-scrollbar-thumb:hover { background: var(--text2); } }

/* ===== 电脑端宽屏：左右对战布局 ===== */
/* ===== 横屏战斗布局 ===== */
.battle-top { display:flex; align-items:center; gap:10px; padding:8px 16px 4px; flex-wrap:wrap; position:relative; }
.flee-btn {
  margin-left:auto; padding:8px 18px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:700;
  background:rgba(248,81,73,0.15); border:1px solid rgba(248,81,73,0.45); color:#f85149;
  transition:all 0.2s ease;
}
@media (hover: hover) { .flee-btn:hover { background:rgba(248,81,73,0.3); transform:scale(1.05); } }
.battle-row { display:flex; flex-direction:column; flex:1; }
.battle-side { display:flex; flex-direction:column; align-items:center; gap:8px; }
.battle-side .pet-sprite { width:110px; height:110px; font-size:54px; }
.battle-stage { display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
.stage-vs { font-size:24px; font-weight:900; color:var(--text2); opacity:0.5; letter-spacing:3px; }
.battle-bottom { display:flex; flex-direction:column; }
.enemy-side { order:1; }
.player-side { order:2; }
.stages-bar { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; justify-content:center; }
.stage-pill { white-space:nowrap; font-size: 12px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,0.06); color:var(--text2); font-weight:700; }
.stage-pill.up { background:rgba(63,185,80,0.18); color:#3fb950; }
.stage-pill.down { background:rgba(248,81,73,0.18); color:#f85149; }

/* 横屏（≥1024px）：左右分置 */
@media (min-width: 1024px) {
  #app { max-width: 1400px; }
  .battle-row { flex-direction:row; align-items:stretch; padding:12px 24px; }
  .battle-side { flex:1; justify-content:flex-start; }
  .player-side { order:1; }
  .battle-stage { order:2; display:flex; width:170px; }
  .enemy-side { order:3; }
  .battle-side .pet-sprite { width:160px; height:160px; font-size:78px; }
  .pet-info-card { min-width:280px; width:85%; }
  .battle-bottom { flex-direction:row; padding:0 24px 16px; gap:16px; align-items:stretch; }
  .battle-log { flex:0 0 30%; display:flex; flex-direction:column; }
  .battle-panel { flex:1; }
  .battle-log .battle-messages { margin:0; flex:1; min-height:180px; max-height:none; }
  .battle-panel .battle-actions { padding:0; }
  .turn-indicator, .turn-timer { margin:0; }
  .battle-messages { margin:0; }
  .battle-ground { display:none; }
}

@media (min-width: 768px) {
  #app { max-width: 960px; }
  .pet-grid { grid-template-columns: repeat(3, 1fr); }
  .pet-grid:has(> :nth-child(4)) { grid-template-columns: repeat(4, 1fr); }
  .menu-buttons { max-width: 420px; margin: 0 auto; }
  .skill-btn { min-height: 62px; }
}

/* ===== 伤害飘字 ===== */
.float-text { position:absolute; top:-8px; left:50%; font-size:22px; font-weight:900; pointer-events:none; z-index:60; text-shadow:0 2px 6px rgba(0,0,0,0.6); animation:floatUp var(--motion-float) ease-out forwards; white-space:nowrap; }
@keyframes floatUp { 0%{opacity:0; transform:translate(-50%,12px) scale(0.7);} 15%{opacity:1; transform:translate(-50%,0) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-46px) scale(1);} }
/* ===== 技能释放反馈 ===== */
.skill-btn.pressed { animation:btnPulse var(--motion-fast) ease; }
.skill-btn.selected { border-color:var(--gold) !important; box-shadow:0 0 14px rgba(226,176,74,0.55) !important; }
@keyframes btnPulse { 0%{transform:scale(1);} 50%{transform:scale(.985);} 100%{transform:scale(1);} }
/* ===== 换宠面板卡片化 ===== */
.switch-pet-btn { flex-direction:row; align-items:center; }
.switch-pet-info { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
.switch-pet-hpwrap { display:flex; align-items:center; gap:6px; }
.switch-pet-hpbar { flex:1; height:6px; background:#1a1f2a; border-radius:3px; overflow:hidden; }
.switch-pet-hpfill { height:100%; background:var(--hp-green); border-radius:3px; transition:width 0.4s ease; }
.switch-pet-hpfill.low { background:var(--hp-yellow); }
.switch-pet-hpfill.critical { background:var(--hp-red); }
.switch-pet-status { display:flex; gap:3px; flex-wrap:wrap; }
/* ===== 亮色主题 ===== */
[data-theme="light"] {
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#eceff4;
  --text:#2d3436; --text2:#636e72; --accent:#e17055;
  --accent2:#ff8a70; --gold:#b8860b; --green:#27ae60;
  --hp-green:#27ae60; --hp-yellow:#f39c12; --hp-red:#e74c3c;
  --shield-color:#2980b9; --border:#dfe4ea;
  --shadow:0 6px 24px rgba(0,0,0,0.12);
  --glow-gold:0 0 16px rgba(184,134,11,0.3);
  --glow-accent:0 0 16px rgba(225,112,85,0.3);
}
[data-theme="light"] body { background-image:radial-gradient(ellipse at 25% 40%, rgba(225,112,85,0.1) 0%, transparent 55%), radial-gradient(ellipse at 75% 30%, rgba(41,128,185,0.1) 0%, transparent 55%); }
[data-theme="light"] .battle-bg { background:linear-gradient(180deg,#e8f0ee 0%,#eef1f6 35%,#f5f6fa 100%); }
[data-theme="light"] .pet-info-card { background:rgba(255,255,255,0.7); }
[data-theme="light"] .battle-messages { background:rgba(255,255,255,0.7); color:var(--text2); }
[data-theme="light"] .battle-messages .msg:last-child { color:var(--text); }
[data-theme="light"] .menu-screen-bg { background:linear-gradient(120deg,#ff6b6b,#ffa94d,#ffd93d,#51cf66,#4dabf7,#9775fa,#ff6b6b); background-size:600% 600%; animation-duration:12s; }
[data-theme="light"] .menu-screen-bg::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.22); pointer-events:none; }
[data-theme="light"] .switch-panel { background:rgba(255,255,255,0.9); }
[data-theme="light"] .modal { background:rgba(255,255,255,0.95); }
[data-theme="light"] .hp-bar-outer { background:#e0e4ea; border-color:#dfe4ea; }
[data-theme="light"] .turn-timer { background:rgba(255,255,255,0.7); }

/* ROCO REMAKE · 2026-10 visual refresh. Append after the existing styles. */
:root {
  color-scheme: dark;
  --bg: #0b1320; --surface: #121e2e; --surface2: #1a293b;
  --text: #e9edf3; --text2: #a1afc0; --accent: #6ac9b6; --accent2: #91ddcc;
  --gold: #dec18a; --green: #68c9ab; --hp-green: #65c9a3;
  --hp-yellow: #e1ba6a; --hp-red: #ef8783; --shield-color: #84b5e9;
  --border: #2b3b4e; --radius: 16px;
  --shadow: 0 16px 42px rgba(1, 8, 17, .22);
  --glow-gold: 0 0 0 1px rgba(222, 193, 138, .25);
  --glow-accent: 0 0 0 3px rgba(106, 201, 182, .15);
  --ui-soft: rgba(138, 165, 198, .07);
  --ui-gold-soft: rgba(222, 193, 138, .08);
  --ui-teal-soft: rgba(106, 201, 182, .08);
  --ui-overlay: rgba(4, 10, 19, .74);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f4; --surface: #fff; --surface2: #e8eef0;
  --text: #213345; --text2: #586b7b; --accent: #207d70; --accent2: #176859;
  --gold: #886326; --green: #237c65; --hp-green: #30876a;
  --hp-yellow: #a97826; --hp-red: #c64e50; --shield-color: #3b79af;
  --border: #ccd7df; --shadow: 0 16px 42px rgba(34, 57, 77, .08);
  --ui-soft: rgba(60, 87, 109, .045);
  --ui-gold-soft: rgba(156, 111, 39, .075);
  --ui-teal-soft: rgba(32, 125, 112, .065);
  --ui-overlay: rgba(26, 42, 58, .5);
}
html { min-width: 0; scroll-behavior: smooth; }
body, [data-theme="light"] body {
  display: block; min-width: 0; min-height: 100vh; margin: 0;
  overflow-x: visible; background: var(--bg); color: var(--text);
  background-image: radial-gradient(ellipse at 50% 0%, var(--ui-teal-soft), transparent 60%);
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
#app { width: calc(100% - 48px); max-width: 1280px; min-width: 0; min-height: 100vh; margin: 0 auto; overflow: visible; }
.screen { width: 100%; min-width: 0; min-height: 100svh; padding: 32px 0 84px; }
.screen.page-enter { animation: screenIn var(--motion-page) var(--ease-enter); }
.screen > *, .battle-row > *, .battle-bottom > *, .menu-shell > * { min-width: 0; }
button, input, select, textarea { font: inherit; }
button { touch-action: manipulation; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 4px;
}
button:disabled, .btn:disabled { cursor: not-allowed; opacity: .48; transform: none !important; box-shadow: none !important; }
.btn { min-height: 48px; border-radius: 11px; padding: 13px 22px; letter-spacing: .3px; font-size: 14px; }
@media (hover: hover) { .btn:hover { transform: translateY(-2px); } }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn-primary { color: #17202b; background: linear-gradient(110deg, #e4c994, #cda86c); border: 1px solid #e8d3aa; box-shadow: 0 6px 18px rgba(157, 117, 48, .13); }
@media (hover: hover) { .btn-primary:hover { box-shadow: 0 8px 24px rgba(157, 117, 48, .2); } }
.btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
@media (hover: hover) { .btn-secondary:hover { border-color: var(--accent); background: var(--surface2); } }
.btn-danger { background: var(--hp-red); color: #111b29; border: 1px solid transparent; }
[data-theme="light"] .btn-danger { color: #fff; }
.screen-header { gap: 16px; padding: 0 64px 20px 0; margin-bottom: 28px; border-color: var(--border); }
.screen-title { font-size: clamp(18px, 2vw, 24px); letter-spacing: .5px; }
.screen-header .back-btn { width: 40px; height: 40px; flex: 0 0 40px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.settings-btn { width: 42px; height: 42px; bottom: 20px; right: 20px; border-radius: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
@media (hover: hover) { .settings-btn:hover { transform: translateY(-2px); } }

/* Menu: one quiet brand stage, one clear primary action. */
.menu-screen-bg, [data-theme="light"] .menu-screen-bg {
  background: radial-gradient(ellipse at 25% 38%, var(--ui-teal-soft), transparent 52%), radial-gradient(ellipse at 75% 70%, var(--ui-gold-soft), transparent 55%), var(--bg);
  background-size: auto; animation: none;
}
.menu-screen-bg::after, [data-theme="light"] .menu-screen-bg::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .23;
  background: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 88px 88px; mask-image: linear-gradient(to bottom, transparent, #000 35%, transparent);
}
.aurora-band { opacity: .32; animation-duration: 24s; filter: blur(70px); }
.aurora-band.b1 { background: rgba(89, 159, 158, .12); }
.aurora-band.b2 { background: rgba(211, 176, 110, .1); }

const STORAGE_KEY_PETS = "pbg_custom_pets";
const STORAGE_KEY_SKILLS = "pbg_custom_skills";
function loadCustomPets() { try { var d = JSON.parse(localStorage.getItem(STORAGE_KEY_PETS)); return Array.isArray(d) ? d.filter(function(p){return p&&p.id;}) : []; } catch(e) { return []; } }
function saveCustomPets(pets) { localStorage.setItem(STORAGE_KEY_PETS, JSON.stringify(pets)); }
const STORAGE_KEY_LOADOUTS = "pbg_pet_loadouts";
function loadPetLoadouts() { try { var d = JSON.parse(localStorage.getItem(STORAGE_KEY_LOADOUTS)); return d && typeof d === "object" ? d : {}; } catch (e) { return {}; } }
function savePetLoadouts(map) { localStorage.setItem(STORAGE_KEY_LOADOUTS, JSON.stringify(map)); }
function loadCustomSkills() { try { var d = JSON.parse(localStorage.getItem(STORAGE_KEY_SKILLS)); return Array.isArray(d) ? d.filter(function(s){return s&&s.id;}) : []; } catch(e) { return []; } }
function saveCustomSkills(skills) { localStorage.setItem(STORAGE_KEY_SKILLS, JSON.stringify(skills)); }
function getAllSkills() {
  var custom = loadCustomSkills();
  var builtinIds = new Set(DEFAULT_SKILLS.map(function(s) { return s.id; }));
  var defaults = DEFAULT_SKILLS.map(function(skill) {
    var saved = custom.find(function(s) { return s.id === skill.id; });
    if (!saved) return skill;
    var merged = Object.assign({}, skill);
    if (typeof saved.name === "string" && saved.name.trim()) merged.name = saved.name;
    if (typeof saved.desc === "string") merged.desc = saved.desc;
    return merged;
  });
  return defaults.concat(custom.filter(function(s) { return !builtinIds.has(s.id); }));
}
function getAllPets() {
  var loadouts = loadPetLoadouts();
  var saved = loadCustomPets();
  var builtinIds = new Set(DEFAULT_PETS.map(function(p) { return p.id; }));
  var knownSkillIds = new Set(DEFAULT_SKILLS.concat(loadCustomSkills()).map(function(s) { return s.id; }));
  var custom = saved.filter(function(p) { return !builtinIds.has(p.id); });
  var defaults = DEFAULT_PETS.map(function(dp) {
    // 旧档按需读入，保留原始记录及内置血脉函数；新档优先。
    var legacy = saved.find(function(p) { return p.id === dp.id; });
    var lo = loadouts[dp.id];
    if (!legacy && !lo) return dp;
    var merged = Object.assign({}, dp);
    var ownedSkillIds = dp.skillIds;
    [legacy, lo].filter(Boolean).forEach(function(record) {
      ["name", "emoji"].forEach(function(key) {
        if (typeof record[key] === "string" && record[key].trim()) merged[key] = record[key];
      });
      if (Number.isInteger(record.level) && record.level > 0) merged.level = record.level;
      var stats = record.baseStats || record.stats;
      if (stats) {
        merged.baseStats = Object.assign({}, merged.baseStats);
        Object.keys(dp.baseStats).forEach(function(key) {
          if (Number.isFinite(stats[key]) && stats[key] >= 0) merged.baseStats[key] = stats[key];
        });
      }
      if (Array.isArray(record.ownedSkillIds) && record.ownedSkillIds.length) {
        ownedSkillIds = Array.from(new Set(dp.skillIds.concat(record.ownedSkillIds))).filter(function(id) {
          return knownSkillIds.has(id);
        });
      }
    });
    merged.ownedSkillIds = ownedSkillIds;
    // 丢弃无效或重复槽位，同时保持合法技能的原始顺序。
    [legacy, lo].filter(Boolean).forEach(function(record) {
      if (!Array.isArray(record.skillIds)) return;
      var ids = Array.from(new Set(record.skillIds)).filter(function(id) { return ownedSkillIds.includes(id); });
      if (ids.length) merged.skillIds = ids.slice(0, 4);
    });
    return merged;
  });
  return defaults.concat(custom);
}
function findSkill(id) { return getAllSkills().find(s => s.id === id); }
function findPet(id) { return getAllPets().find(p => p.id === id); }

    this.damageCapThreshold = 0;       // 限伤触发阈值
    this.damageCapTurns = 0;           // 限伤剩余回合
    this.passiveDamageReduction = 0;   // 常驻伤害减免%
    this.damageReduction = 0;          // 伤害减免%
    this.damageReductionTurns = 0;     // 减免剩余回合
    this.superEffReduction = 0;        // 克制伤害减免%
    this.fixedDmgHealPct = 0;         // 固伤反转治疗%
    this.statusImmunitySources = new Map();
    this.outputReduction = 0;          // 输出降低%
    this.healInvertPct = 0;            // 倒置治疗比例（0-1）
    this.healInvertTurns = 0;         // 倒置治疗剩余回合
    this.statLocked = false;           // 强化锁定
    this.critRateBonus = 0;            // 暴击率加成（0-1）
    // === 极影迪莫明念引擎字段 ===
    this.lastDealtDamage = 0;         // 上回合造成伤害总值
    this.outputThisTurn = 0;          // 本回合累计对敌输出（含固伤）
    this.damageTakenThisTurn = [];    // 本回合承伤分段（残脉公式用）
    this.lastTakenSegments = [];      // 上回合承伤分段
    this.lastTakenTotal = 0;          // 上回合承伤总值
    this.skillsUsedThisTurn = 0;      // 本回合使用技能次数
    this.lastTurnOutput = 0;          // 上回合的总输出（回合末结算）
    this.currentDealt = 0;            // 本回合累计造成伤害
    this.lastPPDeletedSkill = null;   // 上次被删除PP的技能
    this.skillPPCostMult = 1;         // PP消耗倍率
    this.priorityOverride = null;     // 先手值覆盖
    this.dodgeLethalLeft = 0;         // 致命伤害闪避次数
    this.oppConsecutive = {};         // 对方连续使用技能计数
    this.lastUsedSkillId = null;      // 上回合使用的技能
    this.lastPowerSkillId = null;     // 上次使用的威力技能（明念回复目标）
    this.maxHpBonus = 0;              // 精力上限增幅
    this.mingNianDmg = 0;             // 明念追加固伤
    this.invincible = false;          // 免疫一切伤害与效果
    this.healReducePct = 0;           // 受到的治疗降低%（瞬华冰冻）
    // 出战最多 4 个技能（技能池可以更多）
    this.skills = petData.skillIds.slice(0, 4).map(function(sid) {
      var s = findSkill(sid); return s ? { ...s, pp: s.maxPp, priority: s.priority || 8 } : null;
    }).filter(Boolean);
    if (this.bloodline && this.bloodline.name === "清念/残脉" && getQingyuStartingMode(this) === null) {
      setQingyuOriginalBloodline(this, true);
    }
    if (this.bloodline && this.bloodline.name === "不灭魂体") {
      var creationSkill = this.skills.find(skill => skill.id === "sk_cszn");
      if (creationSkill) {
        grantStatusImmunity(this, "创世之能", Infinity, { statuses: ["freeze", "sleep", "fear", "bind"] });
        grantStatusImmunity(this, "创世之能（0 PP）", Infinity, { active: () => creationSkill.pp === 0 });
      }
    }
  }
  getStat(stat) {
    var stages = { atk: this.atkStage, def: this.defStage, spatk: this.spatkStage, spdef: this.spdefStage, spd: this.spdStage };
    var stage = stages[stat] || 0;
    var mult = stage >= 0 ? (2 + stage) / 2 : 2 / (2 - stage);
    var val = this[stat] * mult;
    if (stat === "spd") { if (this.status === "paralyze") val *= 0.5; val *= (this.spdMod || 1); }
    return Math.floor(val);
  }
  isFainted() { return this.hp <= 0; }
  canAct() {
    // 控制状态即时复查；只缓存麻痹随机数，不能缓存尚未受控时的 true。
    if (this.isFainted() || this.status === "freeze" || this.status === "sleep" || this.status === "fear") return false;
    if (this.status !== "paralyze") return true;
    var turn = gameState.turnCount || 0;
    if (this.__canActTurn === turn && this.__canActValue !== undefined) return this.__canActValue;
    var v = Math.random() >= 0.25;
    this.__canActTurn = turn; this.__canActValue = v;
    return v;
  }
  getDamageReduction() {
    if (gameState.banEffects && gameState.banEffects.dmgReduction) return 0;
    const timedReduction = this.damageReductionTurns > 0 ? this.damageReduction : 0;
    return Math.max(this.passiveDamageReduction, timedReduction);
  }
  takeDamage(dmg) {
    // 免疫一切伤害（降华第1回合）
    if (this.invincible) { return 0; }
    // 致命伤害闪避（极影光幕）
    if (this.dodgeLethalLeft > 0 && dmg >= this.hp && this.hp > 0) {
      this.dodgeLethalLeft--;
      addMessage(this.name + " 闪避了致命伤害！");
      return 0;
    }
    // 限伤检查
    if (!(gameState.banEffects && gameState.banEffects.damageCap) && this.damageCapTurns > 0 && this.damageCap < Infinity) {
      if (dmg > this.damageCapThreshold) dmg = Math.min(dmg, this.damageCap);
    }
    // 伤害减免
    const reduction = this.getDamageReduction();
    if (reduction > 0) dmg = Math.floor(dmg * (100 - reduction) / 100);
    // 护盾吸收（带日志+飘字）
    if (this.shield > 0) {
      if (this.shield >= dmg) { this.shield -= dmg; addMessage(this.name + " 的护盾吸收了" + dmg + "点伤害！"); spawnFloatText(this, dmg, "shield"); return 0; }
      addMessage(this.name + " 的护盾吸收了" + this.shield + "点伤害，剩余" + (dmg - this.shield) + "点穿透！");
      spawnFloatText(this, this.shield, "shield");
      dmg -= this.shield; this.shield = 0;
    }
    // 致死检测
    if (dmg >= this.hp) {
      this.lethalHitThisTurn = true;
      this.preDeathHP = this.hp;
    }
    this.hp = Math.max(0, this.hp - dmg);
    if (dmg > 0) { this.damageTakenThisTurn.push(dmg); spawnFloatText(this, dmg, "dmg"); }
    this.segmentIdx++;
    return dmg;
  }
  heal(amount) {
    var effective = Math.floor(amount * (this.healMod || 1));
    if (this.healInvertTurns > 0 && this.healInvertPct > 0) {
      var inverted = Math.floor(effective * this.healInvertPct);
      var actualHeal = effective - inverted;
      this.hp = Math.max(0, this.hp - inverted);
      this.hp = Math.min(this.maxHp, this.hp + actualHeal);
      if (inverted > 0) addMessage(this.name + "的治疗被倒置！受到" + inverted + "点伤害");
      return actualHeal - inverted;
    }
    var before = this.hp;
    var cap = this.maxHp + (this.maxHpBonus || 0);
    var healAmt = Math.floor(amount * (this.healMod || 1));
    if (this.healReducePct > 0) healAmt = Math.floor(healAmt * (100 - this.healReducePct) / 100);
    this.hp = Math.min(cap, this.hp + healAmt);
    var healedAmt = this.hp - before;
    if (healedAmt > 0) spawnFloatText(this, healedAmt, "heal");
    return healedAmt;
  }
}

// ---------- GLOBAL STATE ----------
var gameState = {
  screen: "menu", playerParty: [], aiParty: [],
  playerActive: null, aiActive: null,
  messages: [], isPlayerTurn: true,
  battleOver: false, waitingForSwitch: false, pendingPlayerSkill: null, pendingAISkill: null, pendingPlayerAction: null, resolvingTurn: false, turnTimer: null, autoSkipTimer: null, turnTimeLeft: 0,
  selectedTeamIds: [], opponentTeamIds: [],
  turnCount: 0, weather: null, weatherTurns: 0, field: null, fieldTurns: 0, banEffects: null, logFilter: "all", logCollapsed: {},
  snapshots: [],       // 状态快照历史
  ppHistory: []        // 全局PP历史 [{turn, pets: [{id,pp}]}]
};

// ---------- BATTLE CONTEXT (V3 extended) ----------
function createBattleContext() {
  return {
    doDamage: function(att, def, power, cat, el, opts) {
      opts = opts || {};
      power = getSkillPower(this.sourceSkillOwner === att ? this.sourceSkill : null, power);
      // 极尽降华：全场技能视为光系（覆盖技能自身系别）
      if (gameState.forceSkillElement) el = gameState.forceSkillElement;
      if (def.immunePowerDamage && power > 0) { this._lastEff = 1; this._lastDmg = 0; att.lastOutputDmg = 0; return { damage: 0, effectiveness: 1, isCrit: false }; }
      var isPhysical = cat === "physical";
      var atkStat = isPhysical ? (opts.atkStageOverride ? att.atk * ((2+opts.atkStageOverride)/2) : att.getStat("atk")) : att.getStat("spatk");
      var defStat = isPhysical ? def.getStat("def") : def.getStat("spdef");
      var dmg = Math.floor(((2 * att.level / 5 + 2) * power * (atkStat / defStat)) / 50 + 2); dmg = Math.floor(dmg * (0.85 + Math.random() * 0.15));
      if (el === (att.skillElementOverride || att.element)) dmg = Math.floor(dmg * 1.5);
      var eff = getEffectiveness(el, def.element);
      dmg = Math.floor(dmg * eff);
      dmg = Math.floor(dmg * getWeatherDamageMod(el, def.element));
      var isCrit = false;
      var critBlocked = !!att.preventCritNext;
      if (cat !== "status" && !critBlocked && (opts.guaranteedCrit || Math.random() < (0.0625 + (att.critRateBonus || 0)))) {
        dmg = Math.floor(dmg * 1.5); isCrit = true;
      }
      if (att.preventCritNext) att.preventCritNext = false;
      if (att.status === "burn" && isPhysical) dmg = Math.floor(dmg * 0.5);
      dmg = Math.floor(dmg * (att.dmgMod || 1));
      if (att.outputReduction > 0) dmg = Math.floor(dmg * (100 - att.outputReduction) / 100);
      // Bloodline: onBeforeDamage
      if (def.bloodline && def.bloodline.onBeforeDamage) {
        dmg = def.bloodline.onBeforeDamage(def, dmg, "power", att, this);
      }
      // 技能级伤害上下限（万念俱灰等）：在全部修正之后、保底 1 之前生效
      if (opts.maxDamage !== undefined) dmg = Math.min(dmg, opts.maxDamage);
      if (opts.minDamage) dmg = Math.max(dmg, opts.minDamage);
      dmg = Math.max(1, dmg);
      this._lastEff = eff; this._lastDmg = dmg;
      // 明念：每次造成伤害追加（40+15×双方强化数）固伤
      if (att.mingNianDmg > 0) { def.takeDamage(att.mingNianDmg); addMessage(att.name + " 明念追加" + att.mingNianDmg + "点固伤！"); }
      att.currentDealt += dmg;
      att.outputThisTurn = (att.outputThisTurn || 0) + dmg;
      att.lastOutputDmg = dmg;
      def.takeDamage(dmg);
      // Bloodline: onAfterDamageSegment
      if (def.bloodline && def.bloodline.onAfterDamageSegment) {
        def.bloodline.onAfterDamageSegment(def, def.segmentIdx - 1, this);
      }
      return { damage: dmg, effectiveness: eff, isCrit: isCrit };
    },
    doFixedDamage: function(target, amount, source) {
      amount = Math.max(1, Math.floor(amount));
      if (source) source.outputThisTurn = (source.outputThisTurn || 0) + amount;
      // Bloodline: onBeforeDamage for fixed
      if (target.bloodline && target.bloodline.onBeforeDamage) {
        amount = target.bloodline.onBeforeDamage(target, amount, "fixed", null, this);
      }
      target.takeDamage(amount);
      if (target.bloodline && target.bloodline.onAfterDamageSegment) {
        target.bloodline.onAfterDamageSegment(target, target.segmentIdx - 1, this);
      }
      return amount;
    },
    doHeal: function(target, amount) { var healed = target.heal(Math.floor(amount)); if (healed > 0) addMessage(target.name + " 回复了" + healed + "HP"); },
    addShield: function(target, amount) { if (gameState.banEffects && gameState.banEffects.shield) { addMessage("护盾已被微灵封体永久限制！"); return; } var amt = Math.floor(amount); target.shield += amt; if (amt > 0) spawnFloatText(target, amt, "shield"); },
    grantStatusImmunity: grantStatusImmunity,
    revokeStatusImmunity: revokeStatusImmunity,
    applyStatus: applyEffect,
    fear: function(target) { return applyEffect(target, "fear"); },
    modifyStat: function(target, stat, stages) {
      if (!Object.hasOwn(STAGE_LABELS, stat) || target.statLocked) return;
      if (stages < 0 && hasStatDropImmunity(target, stat)) return;
      var key = stat + "Stage";
      if (target[key] !== undefined) {
        var before = target[key];
        target[key] = Math.max(-6, Math.min(6, target[key] + stages));
        addMessage(target.name + " 的" + STAGE_LABELS[stat] + " " + (target[key]>=0?"+":"") + target[key] + "级（" + (before>=0?"+":"") + before + "→" + (target[key]>=0?"+":"") + target[key] + "）！");
      }
    },
    deletePP: function(target, slot, amount) {
      var amt = Math.floor(amount);
      var jhSkill = target.skills.find(function(s){ return s.id === "sk_jydm_1"; });
      var jhBefore = jhSkill ? jhSkill.pp : 0;
      if (amt > 0 && target.skills.length > 0) {
        var victim = slot < 0 ? target.skills.find(function(s){ return !s.immuneToPP && !s.ppLocked && s.pp > 0; }) : target.skills[slot];
        if (victim) target.lastPPDeletedSkill = victim;
      }
      if (slot < 0) target.skills.forEach(function(s) { if (!s.immuneToPP && !s.ppLocked) s.pp = Math.max(0, s.pp - amt); });
      else if (target.skills[slot] && !target.skills[slot].immuneToPP && !target.skills[slot].ppLocked) target.skills[slot].pp = Math.max(0, target.skills[slot].pp - amt);
      // 极尽降华：PP 被删至 0 → 被动使用（延后到本回合结算末执行，避免重入）
      if (jhSkill && jhBefore > 0 && jhSkill.pp === 0 && target.bloodline && target.bloodline.name === "明念" && !gameState.pendingJianghua) {
        gameState.pendingJianghua = target;
      }
    },
    restorePP: function(target, slot, amount) {
      if (target.blockPPRecovery) return;
      var amt = Math.floor(amount);
      if (slot < 0) target.skills.forEach(function(s) { if (!s.immuneToPP) s.pp = Math.min(s.maxPp, s.pp + amt); });
      else if (target.skills[slot] && !target.skills[slot].immuneToPP) target.skills[slot].pp = Math.min(target.skills[slot].maxPp, target.skills[slot].pp + amt);
    },
    addMark: function(target, name, amount) { if (!target.marks[name]) target.marks[name] = 0; target.marks[name] += amount; },
    getMark: function(target, name) { return target.marks[name] || 0; },
    addTurnEffect: function(target, name, turns, onTick, onExpire) {
      target.turnEffects.push({ name: name, turnsLeft: turns, onTick: onTick, onExpire: onExpire, createdTurn: gameState.turnCount || 0 });
    },
    saveSnapshot: function() {
      var make = function(party) {
        return (party || []).map(function(pet) {
          return {
            id: pet.id, hp: pet.hp,
            pp: pet.skills.map(function(s){ return s.pp; }),
            stages: STAGE_FIELDS.map(function(key) { return pet[key]; }),
            status: pet.status, statusTurns: pet.statusTurns,
            confuseTurns: pet.confuseTurns, bindTurns: pet.bindTurns
          };
        });
      };
      gameState.snapshots.push({ turn: gameState.turnCount, player: make(gameState.playerParty), ai: make(gameState.aiParty) });
      if (gameState.snapshots.length > 30) gameState.snapshots.shift();
    },
    // 时间回溯：恢复双方全体宠物的精力/PP/强化/异常，返回回溯前后精力差
    restoreSnapshot: function(turnsBack) {
      // 快照在回合末保存，按回合号定位：当前回合 - turnsBack
      var targetTurn = (gameState.turnCount || 0) - turnsBack;
      var idx = -1;
      for (var i = gameState.snapshots.length - 1; i >= 0; i--) {
        if (gameState.snapshots[i].turn <= targetTurn) { idx = i; break; }
      }
      if (idx < 0) idx = 0;
      var snap = gameState.snapshots[idx];
      if (!snap) return 0;
      var before = 0, after = 0;
      [[gameState.playerParty, snap.player], [gameState.aiParty, snap.ai]].forEach(function(cfg) {
        var party = cfg[0] || [], saved = cfg[1] || [];
        party.forEach(function(pet) { before += pet.hp; });
        saved.forEach(function(s) { after += s.hp; });
        party.forEach(function(pet) {
          var s = saved.find(function(x){ return x.id === pet.id; });
          if (!s) return;
          pet.hp = Math.min(pet.maxHp + (pet.maxHpBonus || 0), s.hp);
          pet.skills.forEach(function(sk, i){ if (s.pp[i] !== undefined) sk.pp = s.pp[i]; });
          STAGE_FIELDS.forEach(function(k, i){ if (s.stages[i] !== undefined) pet[k] = s.stages[i]; });
          pet.status = s.status; pet.statusTurns = s.statusTurns;
          pet.confuseTurns = s.confuseTurns || 0; pet.bindTurns = s.bindTurns || 0;
        });
      });
      return Math.abs(after - before);
    },
    savePPState: function() {
      var state = { turn: gameState.turnCount, pets: [] };
      [gameState.playerActive, gameState.aiActive].forEach(function(p, i) {
        if (!p) return;
        state.pets.push({ id: p.id, pps: p.skills.map(function(s) { return { id: s.id, pp: s.pp }; }) });
      });
      gameState.ppHistory.push(state);
      if (gameState.ppHistory.length > 30) gameState.ppHistory.shift();
    },
    rewindPPToMin: function(turns) {
      var cutoff = gameState.turnCount - turns;
      var history = gameState.ppHistory.filter(function(h) { return h.turn >= cutoff; });
      [gameState.playerActive, gameState.aiActive].forEach(function(p) {
        if (!p) return;
        p.skills.forEach(function(s) {
          var minPP = s.pp;
          history.forEach(function(h) {
            h.pets.forEach(function(hp) {
              if (hp.id === p.id) {
                hp.pps.forEach(function(hs) { if (hs.id === s.id && hs.pp < minPP) minPP = hs.pp; });
              }
            });
          });
          s.pp = minPP;
        });
      });
    },
    setDamageCap: function(pet, threshold, cap, turns) { pet.damageCapThreshold = threshold; pet.damageCap = cap; pet.damageCapTurns = turns; },
    setDamageReduction: function(pet, pct) { pet.damageReduction = pct; pet.damageReductionTurns = 1; },
    setCritPrevention: function(pet) { pet.preventCritNext = true; },
    setWeather: function(type, turns) { if (gameState.field) { addMessage("环境在场，天气无法降临！"); return false; } gameState.weather = type; gameState.weatherTurns = turns; addMessage("天气变更为" + (WEATHER_DISPLAY[type]?.[1] || type) + "！持续"+turns+"回合"); return true; },
    setField: function(type, turns) { gameState.field = type; gameState.fieldTurns = turns; addMessage("环境变更为" + ({"dream":"梦境","shunhua":"瞬华"}[type]||type) + "！持续"+turns+"回合"); },
    addCritBonus: function(target, amount, turns) { target.critRateBonus = (target.critRateBonus || 0) + amount; var self = this; setTimeout(function() { target.critRateBonus = Math.max(0, (target.critRateBonus || 0) - amount); }, turns * 1000 || 2000); },
    invertHealing: function(target, pct, turns) { target.healInvertPct = pct; target.healInvertTurns = turns; addMessage(target.name + "的治疗被倒置"+Math.round(pct*100)+"%持续"+turns+"回合！"); },
    msg: function(text) { addMessage(text); },
    get playerActive() { return gameState.playerActive; },
    get aiActive() { return gameState.aiActive; },
    get playerParty() { return gameState.playerParty; },
    get aiParty() { return gameState.aiParty; }
  };
}

// PP 回复封锁与技能指定来源在此判定。
function gainPP(pet, skill, amount, sourceSkillId) {
  if (!skill || amount <= 0) return 0;
  if (pet && pet.blockPPRecovery) return 0;
  if (skill.noPPRecover || (skill.ppRecoverySource && skill.ppRecoverySource !== sourceSkillId)) return 0;
  var before = skill.pp;
  skill.pp = Math.min(skill.maxPp, skill.pp + amount);
  return skill.pp - before;
}

// ---------- BLOODLINE & TURN EFFECT PROCESSING ----------
function processBloodlines() {
  var ctx = createBattleContext();
  [gameState.playerActive, gameState.aiActive].forEach(function(pet) {
    if (pet && !pet.isFainted() && pet.bloodline && pet.bloodline.onTurnStart) {
      pet.bloodline.onTurnStart(pet, ctx);
    }
  });
}

function getQingyuStartingMode(pet) {
  const first = pet.skills[0]?.id;
  if (first === "sk_qy_1" && pet.skills.some(skill => skill.id === "sk_qy_4")) return "清念";
  if (first === "sk_qy_4" && pet.skills.some(skill => skill.id === "sk_qy_1")) return "残脉";
  return null;
}

function setQingyuOriginalBloodline(pet, active) {
  const source = "清羽原初血脉";
  pet.passiveDamageReduction = active ? 20 : 0;
  if (active) grantStatusImmunity(pet, source, Infinity, { statuses: ABNORMAL_WITHOUT_BIND });
  else revokeStatusImmunity(pet, source);
}

// 残念余梦的封存 PP 只在真正的残脉→清念转换时恢复一次。
function enterQingyuMode(pet, mode) {
  var bd = pet.bloodlineData || (pet.bloodlineData = { turnCount: 0, qfzn: 0, healCount: 0 });
  var previous = bd.mode;
  bd.mode = mode;
  bd.modeEntered = true;
  if (pet.bloodline?.name === "清念/残脉") setQingyuOriginalBloodline(pet, false);
  if (previous === "残脉" && mode === "清念" && bd.qy3SavedPP !== undefined) {
    var skill = pet.skills.find(function(s) { return s.id === "sk_qy_3"; });
    if (skill) skill.pp = Math.min(skill.maxPp, bd.qy3SavedPP);
    delete bd.qy3SavedPP;
  }
}

function getSkillPower(skill, power) {
  return power * (1 - (skill ? skill.qingnianPowerLoss || 0 : 0));
}

function getSkillPriority(skill) {
  return (skill.priority === undefined ? 8 : skill.priority) - (skill.qingnianPriorityLoss || 0);
}

function applyQingnianSuppression(pet, skill) {
  if (pet.qingnianWindowEnd === undefined || gameState.turnCount > pet.qingnianWindowEnd || skill.__struggle) return;
  if (skill.category === "status") {
    skill.qingnianPriorityLoss = (skill.qingnianPriorityLoss || 0) + 1;
    addMessage("【清念沉脉】" + pet.name + " 的" + skill.name + "先手永久-1！");
  } else {
    skill.qingnianPowerLoss = Math.min(0.5, (skill.qingnianPowerLoss || 0) + 0.3);
    addMessage("【清念沉脉】" + pet.name + " 的" + skill.name + "威力永久削弱" + Math.round(skill.qingnianPowerLoss * 100) + "%！");
  }
}

function processTurnEffects(pet) {
  if (!pet || pet.isFainted()) return;
  // 先快照再清空：onTick 内注册的新效果写入新数组，不会被本轮结果覆盖
  var queue = pet.turnEffects.slice();
  pet.turnEffects = [];
  queue.forEach(function(e) {
    if (!e) return;
    if (e.onTick) e.onTick(pet);
    // 本回合刚创建的效果不在本回合递减，避免“1回合”当场归零
    if (e.createdTurn === (gameState.turnCount || 0)) { pet.turnEffects.push(e); return; }
    e.turnsLeft--;
    if (e.turnsLeft <= 0) { if (e.onExpire) e.onExpire(pet); }
    else pet.turnEffects.push(e);
  });
  tickStatusImmunities(pet);
  // 保留既有封锁结束点：上一回合施加的封锁仍覆盖本回合开场回复。
  pet.blockPPRecovery = false;
}

function postDamageProcessing() {
  // Check lethal hit survival (不灭魂体 mechanic)
  [gameState.playerActive, gameState.aiActive].forEach(function(pet) {
    if (!pet || !pet.bloodline) return;
    if (pet.lethalHitThisTurn && pet.bloodline.name === "不灭魂体" && !pet.lethalHandled) {
      pet.lethalHandled = true;
      pet.hp = 1;
      pet.skills.forEach(function(s) { if (!s.immuneToPP) s.pp = Math.max(0, s.pp - 4); });
      addMessage(pet.name + " 被致命一击！不灭魂体保留1点精力！全体技能-4PP！");
      // Force switch
      forceSwitchPet(pet);
    }
  });
}

function forceSwitchPet(pet) {
  if (pet.immuneEject) { addMessage(pet.name + " 免疫了驱逐效果！"); return; }
  var party = gameState.playerActive === pet ? gameState.playerParty : gameState.aiParty;
  var candidates = party.filter(function(p) { return !p.isFainted() && p !== pet; });
  if (!candidates.length) return;
  var next = candidates[Math.floor(Math.random() * candidates.length)];
  if (gameState.playerActive === pet) {
    if (gameState.playerActive) gameState.playerActive.qlSealMark = false;
    addMessage(pet.name + " 被迫换下！"); gameState.playerActive = next; callBloodlineEnter(next); addMessage("换上 " + next.name + "！");
  } else {
    addMessage(pet.name + " 被迫换下！"); gameState.aiActive = next; callBloodlineEnter(next); addMessage("对手换上 " + next.name + "！");
  }
  renderBattle(document.querySelector("#app"));
  return next;
}

function processWeather() {

function getWeatherDamageMod(atkEl, defEl) {
  if (!gameState.weather) return 1.0;
  switch(gameState.weather) {
    case "sunny": return atkEl === "fire" ? 1.5 : atkEl === "water" ? 0.5 : 1.0;
    case "rainy": return atkEl === "water" ? 1.5 : atkEl === "fire" ? 0.5 : 1.0;
    default: return 1.0;
  }
}

// ---------- LEGACY FUNCTIONS ----------
function calcDamage(attacker, defender, skill) {
  if (skill.power === 0) return { damage: 0, effectiveness: 1, isCrit: false };
  if (defender.immunePowerDamage && skill.power > 0) return { damage: 0, effectiveness: 1, isCrit: false };
  var isPhysical = skill.category === "physical";
  var atkStat = isPhysical ? attacker.getStat("atk") : attacker.getStat("spatk");
  var defStat = isPhysical ? defender.getStat("def") : defender.getStat("spdef");
  var dmg = Math.floor(((2 * attacker.level / 5 + 2) * getSkillPower(skill, skill.power) * (atkStat / defStat)) / 50 + 2);
  dmg = Math.floor(dmg * (0.85 + Math.random() * 0.15));
  if (skill.element === (attacker.skillElementOverride || attacker.element)) dmg = Math.floor(dmg * 1.5);
  var eff = getEffectiveness(skill.element, defender.element);
  dmg = Math.floor(dmg * eff);
  dmg = Math.floor(dmg * getWeatherDamageMod(skill.element, defender.element));
  var isCrit = false;
  if (skill.category !== "status" && Math.random() < (0.0625 + (attacker.critRateBonus || 0)) && !attacker.preventCritNext) { dmg = Math.floor(dmg * 1.5); isCrit = true; }
  if (attacker.preventCritNext) attacker.preventCritNext = false;
  if (attacker.status === "burn" && isPhysical) dmg = Math.floor(dmg * 0.5);
  dmg = Math.floor(dmg * (attacker.dmgMod || 1));
  if (attacker.outputReduction > 0) dmg = Math.floor(dmg * (100 - attacker.outputReduction) / 100);
  return { damage: Math.max(1, dmg), effectiveness: eff, isCrit: isCrit };
}

// 防控按宠物与来源登记，由同一处负责刷新、累加和到期。
const ABNORMAL_WITHOUT_BIND = ["burn", "freeze", "paralyze", "poison", "sleep", "confuse", "fear"];
const ABNORMAL_STATUSES = ABNORMAL_WITHOUT_BIND.concat("bind");
const STATUS_LABELS = { burn: "烧伤", freeze: "冰冻", paralyze: "麻痹", poison: "中毒",
  sleep: "睡眠", fear: "恐惧", confuse: "混乱", bind: "束缚", leech_seed: "寄生" };
const STATUS_MESSAGES = { burn: "烧伤了", freeze: "被冰冻了", paralyze: "麻痹了", poison: "中毒了",
  sleep: "睡着了", fear: "被恐惧了", confuse: "混乱了", bind: "被束缚了", leech_seed: "被寄生种子缠住了" };

function grantStatusImmunity(pet, source, turns, options = {}) {
  const sources = pet.statusImmunitySources;
  const previous = sources.get(source);
  const turnsLeft = options.stack && previous ? previous.turnsLeft + turns : turns;
  sources.set(source, {
    source,
    statuses: options.statuses || ABNORMAL_STATUSES,
    stats: options.stats,
    active: options.active,
    turnsLeft,
    createdTurn: gameState.turnCount
  });
  return turnsLeft;
}

function revokeStatusImmunity(pet, source) {
  pet.statusImmunitySources.delete(source);
}

function activeStatusImmunities(pet) {
  if (!pet.statusImmunitySources) return [];
  return Array.from(pet.statusImmunitySources.values()).filter(lock => !lock.active || lock.active());
}

function hasStatusImmunity(pet, status) {
  return activeStatusImmunities(pet).some(lock => lock.statuses.includes(status));
}

function hasStatDropImmunity(pet, stat) {
  return activeStatusImmunities(pet).some(lock =>
    lock.stats === true || (Array.isArray(lock.stats) && lock.stats.includes(stat))
  );
}

function tickStatusImmunities(pet) {
  for (const [source, lock] of pet.statusImmunitySources || []) {
    if (lock.turnsLeft === Infinity || lock.createdTurn === gameState.turnCount) continue;
    lock.turnsLeft--;
    if (lock.turnsLeft <= 0) revokeStatusImmunity(pet, source);
  }
}

function clearTurnEffects(pet) {
  pet.turnEffects = [];
  for (const [source, lock] of pet.statusImmunitySources || []) {
    if (lock.turnsLeft !== Infinity) revokeStatusImmunity(pet, source);
  }
}

function applyEffect(pet, effect, options = {}) {
  if (!Object.hasOwn(STATUS_MESSAGES, effect)) return false;
  if (hasStatusImmunity(pet, effect)) {
    addMessage(pet.name + "免疫了" + STATUS_LABELS[effect] + "！");
    return false;
  }
  const independent = effect === "confuse" || effect === "bind";
  // 已有同种主异常时保留原状态与时长，也保留技能原先的成功分支。
  if (pet.status && !independent && !options.replace) return pet.status === effect;
  const turns = options.turns ?? (
    effect === "sleep" ? 1 + Math.floor(Math.random() * 3) :
    effect === "fear" ? 1 + Math.floor(Math.random() * 2) :
    effect === "confuse" ? 2 + Math.floor(Math.random() * 3) :
    effect === "bind" ? 2 + Math.floor(Math.random() * 4) : 0
  );
  if (effect === "confuse") pet.confuseTurns = turns;
  else if (effect === "bind") pet.bindTurns = turns;
  else if (effect === "leech_seed") pet.leechSeed = true;
  else { pet.status = effect; pet.statusTurns = turns; }
  addMessage(options.message || pet.name + " " + STATUS_MESSAGES[effect] + "！");
  return true;
}

// ---------- 战斗日志消息 ----------
// 统一消息模型：{ text, type: action|damage|heal|status|system|turn, side: player|ai|system, turn }
function classifyMessage(text) {
  var s = String(text);
  if (/^━+/.test(s)) return "turn";
  if (/造成|伤害|固伤|反伤|攻击了自己/.test(s)) return "damage";
  if (/回复|治疗|护盾|吸收了/.test(s)) return "heal";
  if (/免疫|陷入|混乱|烧伤|冰冻|麻痹|中毒|睡眠|恐惧|束缚|寄生|强化|提升|降低|级/.test(s)) return "status";
  if (/天气|环境|回合|换宠|换上|先手|后手|倒下了|战斗开始|逃跑|解除/.test(s)) return "system";
  return "action";
}
function addMessage(msg, type, side) {
  var text = String(msg);
  gameState.messages.push({
    text: text,
    type: type || classifyMessage(text),
    side: side || gameState.currentActingSide || "system",
    turn: gameState.turnCount || 0
  });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
var battleVisualTasks = [];
function clearBattleVisualTasks() { battleVisualTasks.slice().forEach(function(finish) { finish(); }); }
function battleVisualTask(node, duration, cleanup) {
  var done = false, timer, media = typeof window !== "undefined" && typeof window.matchMedia === "function" ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function finish() {
    if (done) return; done = true; clearTimeout(timer);
    if (media && media.removeEventListener) media.removeEventListener("change", changed);
    else if (media && media.removeListener) media.removeListener(changed);
    battleVisualTasks = battleVisualTasks.filter(function(task) { return task !== finish; }); cleanup();
  }
  function changed(e) { if (e.matches) finish(); }
  if (prefersReducedMotion() || node.isConnected === false) { finish(); return finish; }
  battleVisualTasks.push(finish);
  if (media && media.addEventListener) media.addEventListener("change", changed);
  else if (media && media.addListener) media.addListener(changed);
  timer = setTimeout(finish, duration);
  return finish;
}
function spawnFloatText(pet, text, type) {
